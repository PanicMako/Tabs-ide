services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tabs_exchange
      POSTGRES_USER: tabs_exchange
      POSTGRES_PASSWORD: testpassword
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabs_exchange"]
      interval: 2s
      retries: 10

  s3:
    image: adobe/s3mock:latest
    ports:
      - "127.0.0.1:${TEST_S3_PORT:-9090}:9090"
    environment:
      initialBuckets: tabs-exchange-test
