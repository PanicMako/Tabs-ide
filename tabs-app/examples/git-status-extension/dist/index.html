<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Git Status</title>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main>
      <h1>Git Status</h1>
      <p>Tabs reports only the active project's branch and dirty state. This tool cannot run Git commands.</p>
      <button id="refresh" type="button">Refresh Git status</button>
      <p id="message" role="status" aria-live="polite"></p>
      <dl>
        <dt>Branch</dt>
        <dd id="branch">Unknown</dd>
        <dt>Changes</dt>
        <dd id="dirty">Unknown</dd>
      </dl>
    </main>
  </body>
</html>
