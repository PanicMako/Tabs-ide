$('#app').innerHTML=`<div class="shell ${ui.sideOpen?'side-open':''}"><aside class="sidebar"><div class="brand"><div class="mark"><b>R</b></div><span class="brand-text">relay<span class="period">.</span></span><span class="demo-mark">PREVIEW</span></div><div class="sidegroup-label"><span class="caps">Projects</span><button data-act="new-project" title="Create project" aria-label="Create project">${ico('plus',15)}</button></div><div>${db.projects.map(q=>`<button class="project-row ${q.id===ui.pid?'active':''}" data-act="project" data-id="${q.id}"><span class="project-initial" style="background:${q.color}25;color:${q.color}">${esc(q.symbol||q.name[0])}</span><span class="grow truncate">${esc(q.name)}</span>${q.id===ui.pid?ico('chev',13):''}</button>`).join('')}</div><div class="side-separator"></div><div class="sidegroup-label"><span class="caps">In this project</span><button data-act="new-folder" title="New folder" aria-label="New folder">${ico('plus',15)}</button></div><div class="tree-scroll"><button class="tree-row ${!ui.folder?'active':''}" data-act="root"><span style="color:#a4c99c">${ico('grid',15)}</span><span class="grow truncate">Everything</span><span class="tree-count">${db.nodes.filter(x=>x.projectId===ui.pid&&x.type==='note').length}</span></button>${buildTree(null,0)}</div><div class="sidebottom"><button class="sidebar-action" data-act="new-note">${ico('plus',16)} Leave a note <span class="kbd">⌘ N</span></button><button class="sidebar-action" data-act="search">${ico('search',16)} Find something <span class="kbd">⌘ K</span></button><button class="sidebar-action" data-act="settings">${ico('settings',16)} Make it yours</button></div></aside><main class="main"><header class="topbar"><div class="flex gap8"><button class="iconbtn mobilemenu" aria-label="Open menu" data-act="side">${ico('menu',19)}</button><nav class="crumbs"><button data-act="root">${esc(p.name)}</button>${crumb.map(x=>`<span class="crumbsep">/</span><button data-act="folder" data-id="${x.id}">${esc(x.title)}</button>`).join('')}</nav></div><div class="topactions"><button class="topsearch" data-act="search">${ico('search',15)}<b style="font-weight:560">Find a note</b><span>⌘ K</span></button><button class="iconbtn" title="Settings" data-act="settings">${ico('settings',18)}</button></div></header><div class="content"><div class="content-head"><div><div class="eyebrow"><span class="eyeline"></span>${inRoot?'YOUR SPACE':'FOLDER'} <span style="color:#627562">/</span> ${db.nodes.filter(x=>x.projectId===ui.pid&&x.type==='note').length} NOTES</div><h1 class="page-title">${esc(title)}<span style="color:var(--accent)">.</span></h1><p class="page-desc">${esc(sections||'A place for whatever you need to remember.')}</p></div><div class="folder-tools"><button class="outlinebtn" data-act="new-folder">${ico('folder',15)} New folder</button><button class="primarybtn" data-act="new-note">${ico('plus',16)} Leave a note</button>${ui.folder?`<button class="iconbtn" title="Folder options" data-act="folder-options" data-id="${ui.folder}">${ico('more',19)}</button>`:''}</div></div>${most&&inRoot?`<div class="next-up"><div class="grow"><div class="next-kicker">Last time you were here</div><h3>${esc(most.title)}</h3><p>${esc(short(most.values?.next||most.body,125))||'Your note is ready whenever you are.'}</p></div><button class="nextaction" data-act="open-note" data-id="${most.id}">Pick up here ${ico('arrow',17)}</button></div>`:''}${folders.length?`<section class="space-section" ${inRoot?'style="margin-top:45px"':''}><div class="section-head"><h2>Folders <span>${folders.length}</span></h2><button class="quietbtn" data-act="new-folder">${ico('plus',14)} Add folder</button></div><div class="folders-grid">${folders.map(f=>`<button class="folder-card" draggable="true" data-drag="${f.id}" data-act="folder" data-id="${f.id}" data-folder-drop="${f.id}"><div class="folder-meta"><span class="folder-icon">${ico('folder',26)}</span><span class="smallhint">${countNotes(f.id)} note${countNotes(f.id)===1?'':'s'}</span></div><strong>${esc(f.title)}</strong><small class="truncate">${esc(f.desc||'Open folder')}</small></button>`).join('')}</div></section>`:''}<section class="note-section" style="margin-top:${folders.length?'42px':'45px'}"><div class="section-head"><h2>${ui.folder?'Notes in this folder':'Notes'} <span>${directNotes.length}</span></h2><div class="note-tools"><select class="scope-choice" id="scope-select" title="Which notes to show"><option value="direct" ${ui.scope==='direct'?'selected':''}>Only here</option><option value="nested" ${ui.scope==='nested'?'selected':''}>Include subfolders</option></select><div class="view-picker" role="group" aria-label="Change view"><button title="List view" data-act="view" data-view="list" class="${ui.view==='list'?'active':''}">${ico('list',14)} <span>List</span></button><button title="Board view" data-act="view" data-view="board" class="${ui.view==='board'?'active':''}">${ico('board',14)} <span>Board</span></button><button title="Gallery view" data-act="view" data-view="gallery" class="${ui.view==='gallery'?'active':''}">${ico('image',14)} <span>Gallery</span></button></div></div></div>${ui.view==='board'?renderBoard(directNotes):ui.view==='gallery'?renderGallery(directNotes):renderList(directNotes)}</section></div></main></div>`;
persistUi();hydrateImages();}
function descText(x){return x?.desc||'Your notes and folders live here. Add whatever helps you remember.'}
function buildTree(parent,depth){if(depth>12)return '';let rows=kids(ui.pid,parent).filter(x=>x.type==='folder');return rows.map(f=>`<div class="tree-group"><button class="tree-row ${ui.folder===f.id?'active':''}" data-act="folder" data-id="${f.id}" data-folder-drop="${f.id}" style="padding-left:${9+Math.min(depth,8)*12}px"><span class="tree-chevron">${ico('chev',11)}</span><span style="color:#a8c6a0">${ico('folder',15)}</span><span class="grow truncate">${esc(f.title)}</span><span class="tree-count">${countNotes(f.id)}</span></button>${buildTree(f.id,depth+1)}</div>`).join('')}
function statusBadge(id){const c=col(id);return `<span class="badge" style="--bullet:${esc(c.color)}"><i></i>${esc(c.name)}</span>`}
function renderList(items){if(!items.length)return empty();return `<div class="listview">${items.map(n=>`<div class="note-row" draggable="true" data-drag="${n.id}" data-act="open-note" data-id="${n.id}" role="button" tabindex="0"><div><div class="title"><span style="color:#a2b899">${ico('file',17)}</span><span>${esc(n.title)}</span>${n.pinned?`<span style="color:#a7c697">${ico('pin',11)}</span>`:''}${n.attachments?.length?`<span class="row-attachment">${ico('image',12)}${n.attachments.length}</span>`:''}</div>${db.prefs.previews?`<div class="sub">${ui.scope==='nested'?esc(trail(n.parentId).map(x=>x.title).join(' / ')||'Project root')+' · ':''}${esc(short(n.body||Object.values(n.values||{}).join(' '),120)||'No details yet')}</div>`:''}</div>${statusBadge(n.statusId)}<span class="meta">${relative(n.updated)}</span><span class="arrow">${ico('arrow',18)}</span></div>`).join('')}</div>`}
function renderBoard(items){return `<div class="board">${db.columns.map(c=>{let arr=items.filter(n=>n.statusId===c.id).sort((a,b)=>(a.order??999)-(b.order??999));return `<div class="board-col"><div class="board-head"><span class="pip" style="--c:${esc(c.color)}"></span><strong>${esc(c.name)}</strong><em>${arr.length}</em></div><div class="board-drop" data-board-drop="${c.id}">${arr.map(n=>`<div class="board-card" draggable="true" data-drag="${n.id}" data-card-drop="${n.id}" data-act="open-note" data-id="${n.id}"><span class="card-type">${esc(tpl(n.templateId).name)}</span>${ui.scope==='nested'?`<span class="card-location">${esc(trail(n.parentId).map(x=>x.title).join(' / ')||'Project root')}</span>`:''}<h3>${esc(n.title)}</h3><p>${esc(short(n.body||Object.values(n.values||{}).join(' '),95)||'Open to add more details')}</p>${n.attachments?.length?`<div class="board-image"><img data-file="${n.attachments[0]}"></div>`:''}<div class="card-foot"><span>${relative(n.updated)}</span><span>${n.attachments?.length?`${ico('image',12)} ${n.attachments.length}`:ico('arrow',13)}</span></div></div>`).join('')}<button class="board-add" data-act="new-note-status" data-status="${c.id}">${ico('plus',14)} Add a note</button></div></div>`}).join('')}</div><p class="scope-line">Drag notes between columns. Customize their names in Settings.</p>`}
function renderGallery(items){if(!items.length)return empty();return `<div class="gallery">${items.map(n=>`<button class="gallery-card" data-act="open-note" data-id="${n.id}"><div class="gallery-cover">${n.attachments?.length?`<img data-file="${n.attachments[0]}">`:ico('file',35)}</div><div class="body">${statusBadge(n.statusId)}<h3>${esc(n.title)}</h3><p>${esc(short(n.body,110)||'Your thoughts belong here.')}</p><span class="smallhint">${relative(n.updated)}</span></div></button>`).join('')}</div>`}
function empty(){return `<div class="emptybox">${ico('file',27)}<h3>A blank page is a good start.</h3><p>Keep a thought, save a screenshot, or write down what you were doing.</p><button class="primarybtn" data-act="new-note">${ico('plus',15)} Leave your first note here</button></div>`}
async function hydrateImages(){for(let im of $$('img[data-file]')){let id=im.dataset.file, f=await getFile(id);if(!f||!im.isConnected)continue;if((f.type||'').startsWith('image/'))im.src=f.src;else{const tile=im.closest('.file-preview-trigger');if(tile){im.remove();tile.insertAdjacentHTML('beforeend',`<span class="attachment-label">${ico('file',17)}<br>${esc(f.name)}</span>`)}else{im.style.display='none'}}}}
function openEditor(id,status){const existing=id?node(id):null;let latest=ui.folder||null;ui.draft=existing?structuredClone(existing):{id:uid(),type:'note',projectId:ui.pid,parentId:latest,title:'',templateId:node(latest)?.defaultTemplate||db.prefs.defaultTemplate||'free',statusId:status||db.columns[0].id,created:now(),updated:now(),order:Date.now(),body:'',values:{},attachments:[],pinned:false};ui.overlay='editor';ui.editStatus=existing?'Saved':'Not saved yet';renderOverlay();setTimeout(()=>$('#note-title')?.focus(),180)}
function mainEditor(){let n=ui.draft,t=tpl(n.templateId),isNew=!node(n.id),pr=proj(n.projectId),f=trail(n.parentId);return `<div class="overlay" data-backdrop="1"><section class="drawer" role="dialog" aria-modal="true" aria-label="Edit note"><div class="drawer-header"><button class="back" data-act="close-overlay">${ico('back',18)} Back to ${esc(ui.folder?node(ui.folder)?.title||pr.name:pr.name)}</button><div class="flex gap8"><button class="iconbtn" title="Move note" data-act="move-note">${ico('move',17)}</button>${!isNew?`<button class="iconbtn" title="Delete note" data-act="delete-note">${ico('trash',17)}</button>`:''}<button class="iconbtn" title="Close" data-act="close-overlay">${ico('close',19)}</button></div></div><div class="editor-inner" id="editor-drop"><div class="edit-overline"><span class="caps">${isNew?'A NEW MEMORY':'YOUR NOTE'}</span><span class="tiny">${esc(pr.name)} ${f.length?' / '+esc(f.map(x=>x.title).join(' / ')):''}</span></div><textarea class="edit-title" rows="1" maxlength="160" id="note-title" data-note-prop="title" placeholder="Give this a name…">${esc(n.title)}</textarea><div class="edit-selects"><select title="Note format" data-note-prop="templateId" id="note-template">${db.templates.map(q=>`<option value="${q.id}" ${t.id===q.id?'selected':''}>${esc(q.name)}</option>`).join('')}</select><select title="Status" data-note-prop="statusId">${db.columns.map(q=>`<option value="${q.id}" ${n.statusId===q.id?'selected':''}>${esc(q.name)}</option>`).join('')}</select><button class="selectlike" data-act="pin-note" title="Keep this note close">${ico('pin',13)} ${n.pinned?'Pinned':'Pin note'}</button></div><div class="edit-grid"><div class="edit-content"><div class="edit-field"><div class="edit-label"><span>Your thoughts</span><span class="format-tools"><button title="Bold" data-act="format" data-format="bold"><b>B</b></button><button title="Bulleted list" data-act="format" data-format="list">≡</button><button title="Code block" data-act="format" data-format="code">&lt;/&gt;</button></span></div><textarea class="edit-long" data-note-prop="body" placeholder="What happened? What did you try? What's worth remembering? Dump it all here—messy is fine.">${esc(n.body)}</textarea><div class="field-help">No special formatting needed. Paste code, links, or explanations. This is for future you.</div></div>${t.fields.map(field=>renderCustomField(field,n.values?.[field.id])).join('')}<div class="subnotes"><div class="flex gap12" style="justify-content:space-between"><div class="edit-label" style="margin:0">Sub-notes <small>${inside(n.id).filter(x=>x.type==='note').length}</small></div><button class="quietbtn" data-act="new-subnote" ${isNew?'disabled title="Save this note first"':''}>${ico('plus',14)} Add sub-note</button></div>${inside(n.id).filter(x=>x.type==='note').map(s=>`<button class="subnote-line" data-act="open-note" data-id="${s.id}">${ico('file',14)} <span class="grow truncate">${esc(s.title)}</span>${ico('chev',14)}</button>`).join('')}<div class="field-help">Break down a thought only if it helps.</div></div><div class="helpbox" style="margin-top:33px">Want a different format? <button style="text-decoration:underline;color:#deeed4" data-act="settings-from-editor">Edit note templates</button> to choose which questions appear here—or remove them all.</div></div><aside class="edit-aside"><h4>KEEP WITH THIS NOTE</h4><div class="edit-label">Screenshots & files</div><div class="attachment-zone" data-image-drop="1"><div class="image-grid">${(n.attachments||[]).map(id=>`<div class="image-tile" data-att-file="${id}"><button class="file-preview-trigger" data-act="preview-file" data-file="${id}" title="Open attachment"><img data-file="${id}"></button><button class="image-remove" title="Remove attachment" data-act="remove-attachment" data-file="${id}">${ico('close',14)}</button></div>`).join('')}<button class="add-image" data-act="add-image">${ico('plus',18)} <span>Attach a file</span></button></div></div><p class="side-tip">Drop images here or paste a screenshot anywhere in this note. Files stay in this browser.</p><div class="settings-divider"></div><h4>QUICK DETAILS</h4><div class="edit-field"><div class="edit-label">Files to reopen</div><textarea rows="3" data-note-prop="refs" placeholder="src/extensions/relay.ts&#10;README.md">${esc(n.refs||'')}</textarea><div class="field-help">Paths or links for future you.</div></div><div class="edit-field"><div class="edit-label">Tags</div><input data-note-prop="tags" placeholder="e.g. urgent, UI, research" value="${esc(n.tags||'')}"><div class="field-help">Separate with commas.</div></div><div class="settings-divider"></div><button class="quietbtn" data-act="move-note">${ico('folder',14)} Move to another folder</button></aside></div></div><div class="edit-bottom"><div class="helper"><span id="edit-save-indicator">${esc(ui.editStatus)}</span><br><span>Only you can see these local notes.</span></div><div class="edit-actions">${isNew?`<button class="outlinebtn" data-act="close-overlay">Discard</button><button class="primarybtn" data-act="save-note">${ico('check',15)} Save note</button>`:`<button class="outlinebtn" data-act="close-overlay">Done</button><button class="primarybtn" data-act="save-note">${ico('check',15)} Save changes</button>`}</div></div></section></div>`}
function renderCustomField(f,value){const val=value??'';let opts=(f.options||'').split(',').map(s=>s.trim()).filter(Boolean);let content=f.type==='long'?`<textarea rows="3" data-custom-id="${f.id}" placeholder="Write anything useful...">${esc(val)}</textarea>`:f.type==='check'?`<label class="checkrow"><input type="checkbox" data-custom-id="${f.id}" ${val===true?'checked':''}> Yes / done</label>`:f.type==='select'?`<select data-custom-id="${f.id}"><option value="">Choose an option</option>${opts.map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input type="${f.type==='date'?'date':f.type==='link'?'url':'text'}" data-custom-id="${f.id}" value="${esc(val)}" placeholder="${f.type==='link'?'https://...':'Type here...'}">`;return `<div class="edit-field"><div class="edit-label"><span>${esc(f.name)}</span><small>Optional</small></div>${content}</div>`}
function renderOverlay(){const root=$('#overlayRoot');const prevScroll=root.querySelector('.drawer')?.scrollTop;if(!ui.overlay){root.innerHTML='';return}if(ui.overlay==='editor')root.innerHTML=mainEditor();else if(ui.overlay==='settings')root.innerHTML=settings();else if(ui.overlay==='search')root.innerHTML=searchDialog();else if(ui.overlay==='form')root.innerHTML=formDialog();else if(ui.overlay==='move')root.innerHTML=moveDialog();else if(ui.overlay==='confirm')root.innerHTML=confirmDialog();else if(ui.overlay==='lightbox')root.innerHTML=`<div class="overlay clickable" data-backdrop="1"><div class="lightbox"><img id="zoomed-img" alt="Attached image"></div></div>`;hydrateImages();if(ui.overlay==='editor'&&prevScroll!=null){const dr=root.querySelector('.drawer');if(dr)dr.scrollTop=prevScroll}}
function dialogInner(title,content,cls=''){return `<div class="overlay clickable" data-backdrop="1"><div class="dialog ${cls}" role="dialog" aria-modal="true"><div class="flex gap8" style="justify-content:space-between;margin-bottom:14px"><span class="caps">Relay</span><button class="iconbtn" data-act="close-overlay">${ico('close',18)}</button></div><h2>${title}</h2>${content}</div></div>`}
function formDialog(){const f=ui.form;let isEdit=f.mode==='rename';let labels={project:'project',folder:'folder'};let entity=labels[f.kind]||f.kind;return dialogInner(`${isEdit?'Rename':'New'} ${entity}`,`<p>${isEdit?'Give it a name that makes sense to you.':'Keep it simple. You can organize it differently later.'}</p><form id="basic-form"><div class="form-field"><label>Name</label><input name="name" id="form-name" value="${esc(f.value||'')}" placeholder="${f.kind==='project'?'My next project':'Ideas, experiments, things to fix…'}" maxlength="140" required autofocus></div>${f.kind==='folder'?`<div class="form-field"><label>Short description <span class="muted">(optional)</span></label><input name="desc" value="${esc(f.desc||'')}" placeholder="What belongs in this folder?"></div>`:''}<div class="dialog-row"><button type="button" class="outlinebtn" data-act="close-overlay">Cancel</button><button class="primarybtn" type="submit">${isEdit?'Save changes':'Create '+entity}</button></div></form>`)}
function moveDialog(){let d=ui.draft||node(ui.moveId);if(!d)return '';let options=[{id:'',label:'Project root',depth:0},...db.nodes.filter(x=>x.type==='folder'&&x.projectId===d.projectId&&x.id!==d.id&&!isDescendant(x,d.id)).map(x=>({id:x.id,label:x.title,depth:trail(x.id).length}))];return dialogInner('Where should it live?',`<p>Moving “${esc(d.title)}” won't change the note itself.</p><div style="max-height:320px;overflow:auto">${options.map(o=>`<button class="move-row" style="padding-left:${10+Math.min(o.depth,6)*15}px" data-act="move-to" data-id="${o.id}">${ico(o.id?'folder':'grid',16)} ${esc(o.label)}</button>`).join('')}</div>`)}
function confirmDialog(){let d=ui.confirm;return dialogInner(esc(d.title),`<p>${esc(d.text)}</p><div class="dialog-row"><button class="outlinebtn" data-act="close-overlay">Cancel</button><button class="primarybtn" data-act="confirm-delete" style="background:#eeb4ae;color:#271718!important">Delete</button></div>`)}
function searchDialog(){return dialogInner('Find that thought',`<div class="searchfield">${ico('search',18)}<input id="search-input" placeholder="Search notes, paths, and ideas…" autocomplete="off" autofocus></div><div class="results" id="search-results"></div><p class="smallhint" style="margin-top:14px">Search across every project. Press Esc to close.</p>`)}
function settings(){const tab=ui.settingTab;return `<div class="overlay clickable" data-backdrop="1"><section class="dialog large" role="dialog" aria-modal="true" aria-label="Relay settings"><div class="settings-top"><div class="flex gap8" style="justify-content:space-between"><h2>Make Relay yours.</h2><button class="iconbtn" data-act="close-overlay">${ico('close',18)}</button></div><nav class="settings-tabs"><button data-act="settings-tab" data-tab="templates" class="${tab==='templates'?'active':''}">Note templates</button><button data-act="settings-tab" data-tab="board" class="${tab==='board'?'active':''}">Board columns</button><button data-act="settings-tab" data-tab="preferences" class="${tab==='preferences'?'active':''}">Preferences & data</button></nav></div><div class="settings-content">${tab==='templates'?settingsTemplates():tab==='board'?settingsBoard():settingsPrefs()}</div></section></div>`}
function settingsTemplates(){const selected=tpl(ui.selectedTemplate);return `<p>Decide what belongs in a note. Start with a blank page, or add your own questions to remember things later.</p><div class="settings-columns"><div class="template-list">${db.templates.map(t=>`<button class="${t.id===selected.id?'active':''}" data-act="choose-template" data-id="${t.id}">${esc(t.name)} ${t.id===db.prefs.defaultTemplate?' · default':''}</button>`).join('')}<button data-act="add-template" style="color:#cfe8be;margin-top:12px">${ico('plus',13)} New template</button></div><div><div class="builder-head"><input data-template-name="${selected.id}" value="${esc(selected.name)}" aria-label="Template name"><button class="quietbtn" title="Make this the default template" data-act="default-template" data-id="${selected.id}">${ico('check',15)} Default</button>${db.templates.length>1?`<button class="iconbtn" title="Delete template" data-act="delete-template" data-id="${selected.id}">${ico('trash',16)}</button>`:''}</div><div class="flex gap8" style="justify-content:space-between"><span class="mini-label">Questions in this template</span><button class="quietbtn" data-act="add-field">${ico('plus',14)} Add a field</button></div><div style="margin-top:13px">${selected.fields.map((f,i)=>`<div class="field-row"><input class="settings-input" data-field-name="${f.id}" value="${esc(f.name)}" placeholder="What should this ask?"><select class="settings-input" data-field-type="${f.id}">${[['short','Short answer'],['long','Long answer'],['select','Dropdown'],['check','Checkbox'],['date','Date'],['link','Link']].map(([id,label])=>`<option value="${id}" ${f.type===id?'selected':''}>${label}</option>`).join('')}</select><div class="field-controls"><button title="Move up" data-act="field-up" data-id="${f.id}">${ico('up',13)}</button><button title="Move down" data-act="field-down" data-id="${f.id}">${ico('down',13)}</button><button title="Remove field" data-act="field-remove" data-id="${f.id}">${ico('close',13)}</button></div>${f.type==='select'?`<input class="settings-input field-options" data-field-options="${f.id}" value="${esc(f.options||'')}" placeholder="Options, separated by commas">`:''}</div>`).join('')||'<div class="emptybox" style="padding:25px;margin:15px 0"><h3>Nothing to fill in.</h3><p>This template starts with just a title and a place to write. That’s perfectly fine.</p></div>'}</div><div class="helpbox">Every note always has a free-writing area, images, file references and tags. These questions are extras—not a form you must complete.</div></div></div>`}
function settingsBoard(){return `<p>Give your board the steps that make sense to you. Notes move between these columns, but they stay in their original folders.</p><div style="max-width:560px">${db.columns.map((c,i)=>`<div class="column-edit"><input type="color" data-col-color="${c.id}" value="${esc(c.color)}" title="Column color"><input class="settings-input grow" data-col-name="${c.id}" value="${esc(c.name)}" aria-label="Column name"><button class="iconbtn" data-act="column-up" data-id="${c.id}" ${i===0?'disabled':''} title="Move column left">${ico('up',15)}</button><button class="iconbtn" data-act="column-remove" data-id="${c.id}" ${db.columns.length===1?'disabled':''} title="Remove column">${ico('trash',15)}</button></div>`).join('')}<button class="outlinebtn" data-act="add-column" style="margin-top:10px">${ico('plus',15)} Add a column</button><div class="helpbox">Removing a column moves its notes to the first remaining column. Notes are never deleted.</div></div>`}
function settingsPrefs(){return `<div style="max-width:550px"><p>Relay should be quick by default and flexible when you need more.</p><div class="form-field"><label>Default note layout</label><select class="settings-input" data-pref="defaultTemplate">${db.templates.map(t=>`<option value="${t.id}" ${t.id===db.prefs.defaultTemplate?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="form-field"><label>Default folder view</label><select class="settings-input" data-pref="defaultView"><option value="list" ${db.prefs.defaultView==='list'?'selected':''}>List</option><option value="board" ${db.prefs.defaultView==='board'?'selected':''}>Board</option><option value="gallery" ${db.prefs.defaultView==='gallery'?'selected':''}>Gallery</option></select></div><div class="form-field"><label class="flex gap8" style="margin-bottom:0"><input type="checkbox" data-pref="previews" ${db.prefs.previews?'checked':''}> Show a little preview underneath each note</label></div><div class="settings-divider"></div><div class="mini-label" style="margin-bottom:12px">Your local data</div><p>Everything stays in this browser. Export a backup if you want to move it elsewhere. Imported backups replace this demo workspace.</p><div class="flex gap8"><button class="outlinebtn" data-act="export">${ico('download',15)} Export backup</button><button class="outlinebtn" data-act="import">${ico('upload',15)} Import backup</button></div><p class="scope-line">Images are saved in browser storage when available. Real IDE file opening, Git detection and sync are not part of this prototype.</p></div>`}
function updateSearchResults(){let q=($('#search-input')?.value||'').trim().toLowerCase(),rs=$('#search-results');if(!rs)return;let arr=db.nodes.filter(n=>n.type==='note'&&(n.title+' '+n.body+' '+n.tags+' '+n.refs+' '+Object.values(n.values||{}).join(' ')+' '+pathText(n)).toLowerCase().includes(q));arr=arr.sort((a,b)=>new Date(b.updated)-new Date(a.updated)).slice(0,40);rs.innerHTML=arr.length?arr.map(n=>`<button class="result-line" data-act="search-open" data-id="${n.id}">${ico('file',17)}<div class="grow"><strong>${esc(n.title)}</strong><small>${esc(pathText(n))}</small></div>${ico('chev',15)}</button>`).join(''):'<div class="emptybox" style="margin-top:15px">No notes found. Try another word.</div>'}
function closeOverlay(){if(ui.overlay==='lightbox'&&ui.returnAfterLightbox){ui.overlay=ui.returnAfterLightbox;ui.returnAfterLightbox=null;renderOverlay();return}if(ui.overlay==='settings'&&ui.settingsReturnEditor&&ui.draft){ui.settingsReturnEditor=false;ui.overlay='editor';renderOverlay();return}ui.overlay=null;ui.form=null;ui.confirm=null;ui.moveId=null;ui.draft=null;ui.returnAfterLightbox=null;ui.settingsReturnEditor=false;renderOverlay();render()}
function editorAutosave(){let d=ui.draft;if(!d||!node(d.id))return;Object.assign(node(d.id),structuredClone(d),{updated:now()});ui.editStatus='Saved locally';const indicator=$('#edit-save-indicator');if(indicator)indicator.textContent='Saving…';saveState();setTimeout(()=>{if($('#edit-save-indicator'))$('#edit-save-indicator').textContent='Saved locally'},520)}
function formatBody(kind){const area=document.querySelector('[data-note-prop="body"]');if(!area||!ui.draft)return;const start=area.selectionStart,end=area.selectionEnd,sel=area.value.slice(start,end);let replacement=kind==='bold'?`**${sel||'important detail'}**`:kind==='code'?`\n\`\`\`\n${sel||'// paste your code'}\n\`\`\`\n`:sel?sel.split('\n').map(line=>'- '+line).join('\n'):'- ';area.setRangeText(replacement,start,end,'end');ui.draft.body=area.value;editorAutosave();area.focus()}
function saveNote(){let n=ui.draft;if(!n)return;n.title=cleanName(n.title,'Untitled note');n.updated=now();if(!node(n.id))db.nodes.push(structuredClone(n));else Object.assign(node(n.id),structuredClone(n));saveState();toast('Note saved');closeOverlay()}
function deleteNode(id){const n=node(id);if(!n)return;const rmIds=new Set([id,...descendants(id).map(x=>x.id)]);db.nodes=db.nodes.filter(x=>!rmIds.has(x.id));if(ui.folder&&rmIds.has(ui.folder))ui.folder=null;saveState();closeOverlay();toast(n.type==='folder'?'Folder deleted':'Note deleted')}
function openForm(kind,mode='create',n){ui.overlay='form';ui.form={kind,mode,id:n?.id,value:n?.title||n?.name||'',desc:n?.desc||'',parentId:ui.folder};renderOverlay();setTimeout(()=>$('#form-name')?.focus(),100)}
function removeTemplate(id){if(db.templates.length===1)return;db.templates=db.templates.filter(t=>t.id!==id);db.nodes.filter(x=>x.templateId===id).forEach(x=>x.templateId='free');if(db.prefs.defaultTemplate===id)db.prefs.defaultTemplate=db.templates[0].id;ui.selectedTemplate=db.templates[0].id;saveState();renderOverlay();toast('Template removed. Notes kept.')}
function rearrangeField(id,direction){let t=tpl(ui.selectedTemplate),ix=t.fields.findIndex(x=>x.id===id),j=ix+direction;if(ix<0||j<0||j>=t.fields.length)return;[t.fields[ix],t.fields[j]]=[t.fields[j],t.fields[ix]];saveState();renderOverlay()}
function removeCol(id){if(db.columns.length<2)return;const fallback=db.columns.find(x=>x.id!==id).id;db.nodes.filter(x=>x.type==='note'&&x.statusId===id).forEach(x=>x.statusId=fallback);db.columns=db.columns.filter(x=>x.id!==id);saveState();renderOverlay();render();toast('Column removed; notes moved safely')}
async function uploadAttachments(files){let n=ui.draft;if(!n){toast('Open a note first');return}let list=[...files];for(let file of list){if(file.size>12*1024*1024){toast(`Too large: ${file.name} (12 MB max)`);continue}try{let src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});const id=uid();await putFile({id,name:file.name,type:file.type||'application/octet-stream',size:file.size,src});n.attachments??=[];n.attachments.push(id)}catch(e){console.error(e);toast('Could not attach that file')}}editorAutosave();renderOverlay();toast(`${list.length} file${list.length===1?'':'s'} attached`)}
async function openFile(id){let f=await getFile(id);if(!f)return toast('Attachment not available');if((f.type||'').startsWith('image/')){ui.returnAfterLightbox=ui.overlay||null;ui.overlay='lightbox';renderOverlay();const im=$('#zoomed-img');if(im)im.src=f.src}else{let a=document.createElement('a');a.href=f.src;a.download=f.name||'attachment';a.click()}}
async function exportData(){let files={};for(let n of db.nodes){for(let id of n.attachments||[]){if(!files[id]){let f=await getFile(id);if(f)files[id]=f}}}let json=JSON.stringify({format:'relay-studio-backup',version:1,created:now(),state:db,files},null,2);let link=document.createElement('a');link.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));link.download='relay-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),5000);toast('Backup exported')}
async function importData(file){try{let b=JSON.parse(await file.text());if(b.format!=='relay-studio-backup'||!b.state?.projects||!Array.isArray(b.state?.nodes))throw new Error('Invalid Relay backup');db=b.state;if(idb){let tx=idb.transaction('files','readwrite');tx.objectStore('files').clear();await new Promise(r=>{tx.oncomplete=r});for(let f of Object.values(b.files||{}))await putFile(f)}else window.__temporaryFiles=b.files||{};ui.pid=db.projects[0].id;ui.folder=null;ui.view=db.prefs.defaultView||'list';saveState();closeOverlay();toast('Backup imported')}catch(err){console.error(err);toast('That file is not a valid Relay backup')}}
function navProject(pid){ui.pid=pid;ui.folder=null;ui.view=db.prefs.defaultView||'list';ui.sideOpen=false;render()}
function editFolderOptions(id){const f=node(id);ui.overlay='folder-options';ui.moveId=id;$('#overlayRoot').innerHTML=dialogInner('Folder options',`<p>Organize “${esc(f.title)}” whenever you need to.</p><div class="form-field"><label>Open this folder as</label><select class="settings-input" data-folder-pref="preferredView"><option value="">Use my default</option>${[['list','List'],['board','Board'],['gallery','Gallery']].map(([v,l])=>`<option value="${v}" ${f.preferredView===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="form-field"><label>New notes in this folder start with</label><select class="settings-input" data-folder-pref="defaultTemplate"><option value="">Use my default</option>${db.templates.map(t=>`<option value="${t.id}" ${f.defaultTemplate===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="settings-divider"></div><button class="move-row" data-act="rename-folder">${ico('edit',16)} Rename / describe folder</button><button class="move-row" data-act="move-folder">${ico('move',16)} Move folder</button><button class="move-row" data-act="delete-folder" style="color:#ebaaaa">${ico('trash',16)} Delete folder</button>`)}
function processAction(el,e){const act=el.dataset.act,id=el.dataset.id;switch(act){case 'side':ui.sideOpen=!ui.sideOpen;render();break;case 'root':ui.folder=null;ui.sideOpen=false;render();break;case 'folder':ui.folder=id;ui.view=node(id)?.preferredView||db.prefs.defaultView||'list';ui.sideOpen=false;render();break;case 'project':navProject(id);break;case 'new-project':openForm('project');break;case 'new-folder':openForm('folder');break;case 'new-note':openEditor(null);break;case 'new-note-status':openEditor(null,el.dataset.status);break;case 'open-note':if(ui.overlay==='editor'&&ui.draft&&node(ui.draft.id)){editorAutosave()}openEditor(id);break;case 'view':ui.view=el.dataset.view;render();break;case 'search':ui.overlay='search';renderOverlay();updateSearchResults();setTimeout(()=>$('#search-input')?.focus(),40);break;case 'search-open':{const n=node(id);ui.pid=n.projectId;ui.folder=n.parentId&&node(n.parentId)?.type==='folder'?n.parentId:null;render();openEditor(id);break}case 'settings':ui.overlay='settings';ui.settingTab='templates';renderOverlay();break;case 'settings-from-editor':{if(ui.draft&&node(ui.draft.id))editorAutosave();ui.settingsReturnEditor=true;ui.overlay='settings';ui.settingTab='templates';renderOverlay();break}case 'settings-tab':ui.settingTab=el.dataset.tab;renderOverlay();break;case 'close-overlay':closeOverlay();break;case 'save-note':saveNote();break;case 'pin-note':ui.draft.pinned=!ui.draft.pinned;editorAutosave();renderOverlay();break;case 'format':formatBody(el.dataset.format);break;case 'add-image':$('#attachmentInput').click();break;case 'preview-file':openFile(el.dataset.file);break;case 'remove-attachment':ui.draft.attachments=ui.draft.attachments.filter(x=>x!==el.dataset.file);editorAutosave();renderOverlay();toast('Attachment removed from note');break;case 'move-note':ui.overlay='move';renderOverlay();break;case 'move-to':{if(ui.draft){ui.draft.parentId=id||null;editorAutosave();ui.overlay='editor';renderOverlay();toast('Note moved')}else if(ui.moveId){const x=node(ui.moveId);x.parentId=id||null;x.updated=now();saveState();closeOverlay();toast('Folder moved')}break}case 'delete-note':ui.confirm={id:ui.draft.id,title:'Delete this note?',text:'This deletes the note and any sub-notes. This cannot be undone.'};ui.overlay='confirm';renderOverlay();break;case 'confirm-delete':deleteNode(ui.confirm.id);break;case 'folder-options':editFolderOptions(id);break;case 'rename-folder':openForm('folder','rename',node(ui.moveId));break;case 'move-folder':ui.overlay='move';renderOverlay();break;case 'delete-folder':{let x=node(ui.moveId);ui.confirm={id:x.id,title:`Delete “${x.title}”?`,text:`This will also delete ${descendants(x.id).length} item(s) inside. This cannot be undone.`};ui.overlay='confirm';renderOverlay();break}case 'choose-template':ui.selectedTemplate=id;renderOverlay();break;case 'add-template':{let t={id:uid(),name:'My new template',fields:[]};db.templates.push(t);ui.selectedTemplate=t.id;saveState();renderOverlay();setTimeout(()=>$('.builder-head input')?.select(),40);break}case 'delete-template':removeTemplate(id);break;case 'default-template':db.prefs.defaultTemplate=id;saveState();renderOverlay();toast('Default template updated');break;case 'add-field':{let t=tpl(ui.selectedTemplate);t.fields.push({id:uid(),name:'What should I remember?',type:'long',options:''});saveState();renderOverlay();break}case 'field-up':rearrangeField(id,-1);break;case 'field-down':rearrangeField(id,1);break;case 'field-remove':{let t=tpl(ui.selectedTemplate);t.fields=t.fields.filter(f=>f.id!==id);saveState();renderOverlay();break}case 'add-column':db.columns.push({id:uid(),name:'Another stage',color:'#adc6a3'});saveState();renderOverlay();break;case 'column-up':{let i=db.columns.findIndex(x=>x.id===id);if(i>0)[db.columns[i-1],db.columns[i]]=[db.columns[i],db.columns[i-1]];saveState();renderOverlay();break}case 'column-remove':removeCol(id);break;case 'new-subnote':{let currentId=ui.draft.id;if(!node(currentId))return;editorAutosave();ui.overlay=null;ui.draft=null;openEditor(null);ui.draft.parentId=currentId;renderOverlay();break}case 'export':exportData();break;case 'import':$('#importInput').click();break}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-act]');if(el){e.preventDefault();processAction(el,e);return}if(e.target.matches('[data-backdrop]')){closeOverlay()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.overlay){closeOverlay();return}const mod=e.metaKey||e.ctrlKey;if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();ui.overlay='search';renderOverlay();updateSearchResults();setTimeout(()=>$('#search-input')?.focus(),25)}if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();openEditor(null)}if(e.key==='Enter'&&e.target.matches('.note-row[role=button]')){openEditor(e.target.dataset.id)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='search-input'){updateSearchResults();return}if(t.hasAttribute('data-note-prop')){if(ui.draft){ui.draft[t.dataset.noteProp]=t.value;editorAutosave()}return}if(t.hasAttribute('data-custom-id')){if(ui.draft){ui.draft.values??={};ui.draft.values[t.dataset.customId]=t.type==='checkbox'?t.checked:t.value;editorAutosave()}return}if(t.hasAttribute('data-template-name')){tpl(t.dataset.templateName).name=t.value;saveState();return}if(t.hasAttribute('data-field-name')){let f=tpl(ui.selectedTemplate).fields.find(x=>x.id===t.dataset.fieldName);if(f){f.name=t.value;saveState()}return}if(t.hasAttribute('data-field-options')){let f=tpl(ui.selectedTemplate).fields.find(x=>x.id===t.dataset.fieldOptions);if(f){f.options=t.value;saveState()}return}if(t.hasAttribute('data-col-name')){let c=col(t.dataset.colName);c.name=t.value;saveState();return}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='scope-select'){ui.scope=t.value;render();return}if(t.hasAttribute('data-note-prop')){if(t.dataset.noteProp==='templateId'){ui.draft.templateId=t.value;editorAutosave();renderOverlay()}else if(t.dataset.noteProp==='statusId'){ui.draft.statusId=t.value;editorAutosave()}return}if(t.hasAttribute('data-custom-id')&&t.type==='checkbox'){ui.draft.values[t.dataset.customId]=t.checked;editorAutosave();return}if(t.hasAttribute('data-field-type')){let f=tpl(ui.selectedTemplate).fields.find(x=>x.id===t.dataset.fieldType);f.type=t.value;saveState();renderOverlay();return}if(t.hasAttribute('data-col-color')){col(t.dataset.colColor).color=t.value;saveState();renderOverlay();render();return}if(t.hasAttribute('data-folder-pref')){let f=node(ui.moveId);if(f){f[t.dataset.folderPref]=t.value;saveState();if(t.dataset.folderPref==='preferredView'&&f.id===ui.folder){ui.view=t.value||db.prefs.defaultView;render()}toast('Folder preference saved')}return}if(t.hasAttribute('data-pref')){db.prefs[t.dataset.pref]=t.type==='checkbox'?t.checked:t.value;saveState();if(t.dataset.pref==='defaultView')ui.view=t.value;render();renderOverlay();return}if(t.id==='attachmentInput'){uploadAttachments(t.files);t.value='';return}if(t.id==='importInput'){if(t.files[0])importData(t.files[0]);t.value='';return}});
document.addEventListener('submit',e=>{if(e.target.id!=='basic-form')return;e.preventDefault();const f=ui.form,value=cleanName(e.target.elements.name.value,'Untitled'),desc=e.target.elements.desc?.value||'';if(f.mode==='rename'){let n=node(f.id);n.title=value;n.desc=desc;n.updated=now();saveState();closeOverlay();toast('Folder updated')}else if(f.kind==='project'){let id=uid();db.projects.push({id,name:value,symbol:value.charAt(0).toUpperCase(),color:['#bdd9e6','#e7cba5','#dccde7','#c6d9ad'][db.projects.length%4],desc:'A home for everything you want to remember.'});saveState();closeOverlay();navProject(id);toast('Project created')}else{let id=uid();db.nodes.push({id,type:'folder',projectId:ui.pid,parentId:f.parentId,title:value,desc,updated:now(),created:now()});saveState();closeOverlay();ui.folder=id;render();toast('Folder created')}});
document.addEventListener('dragstart',e=>{let el=e.target.closest('[data-drag]');if(el){dragId=el.dataset.drag;e.dataTransfer?.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-board-drop],[data-folder-drop],[data-image-drop]')){e.preventDefault();e.dataTransfer.dropEffect='move';e.target.closest('[data-board-drop],[data-folder-drop],[data-image-drop]')?.classList.add('drop-ready')}});
document.addEventListener('dragleave',e=>{let el=e.target.closest('[data-board-drop],[data-folder-drop],[data-image-drop]');if(el&&!el.contains(e.relatedTarget))el.classList.remove('drop-ready')});
document.addEventListener('drop',e=>{let area=e.target.closest('[data-board-drop],[data-folder-drop],[data-image-drop]');if(!area)return;e.preventDefault();area.classList.remove('drop-ready');if(area.hasAttribute('data-image-drop')){if(e.dataTransfer?.files?.length)uploadAttachments(e.dataTransfer.files);return}let id=dragId||e.dataTransfer?.getData('text/plain'),n=node(id);if(!n)return;if(area.dataset.boardDrop){if(n.type==='note'){n.statusId=area.dataset.boardDrop;n.updated=now();n.order=Date.now();saveState();render();toast('Moved on the board')}}else if(area.dataset.folderDrop){if(n.id===area.dataset.folderDrop||isDescendant(node(area.dataset.folderDrop),n.id))return toast('Cannot move a folder inside itself');n.parentId=area.dataset.folderDrop;n.updated=now();saveState();render();toast('Moved into folder')}dragId=null});
document.addEventListener('dragend',()=>{$$('[data-folder-drop],[data-board-drop]').forEach(x=>x.classList.remove('drop-ready'));dragId=null});
document.addEventListener('paste',e=>{if(ui.overlay==='editor'&&e.clipboardData?.files?.length){let files=[...e.clipboardData.files].filter(x=>x.type.startsWith('image/'));if(files.length){e.preventDefault();uploadAttachments(files)}}});
init();
})();
</script>
</body>
</html>
