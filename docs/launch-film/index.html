<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tabs — launch film</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="film.css" />
</head>
<body>
<div id="fit">
  <div id="stage">
    <div id="bgInk"></div>
    <div id="bgIvory"></div>
    <div id="world">
      <div id="app"></div>
      <div id="hl"></div>
      <div id="pills"></div>
      <div id="ring"></div>
      <div id="cursor"><svg viewBox="0 0 28 34"><path d="M3 2l21 15.5-9.6 1.6L9.2 28.6z" fill="#0A0B10" stroke="#F3EFE9" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
    </div>
    <div id="headline"></div>
    <div id="side"></div>
    <div id="bgBlue"></div>
    <div id="providers"></div>
    <div id="end"></div>
  </div>
</div>
<div id="hud"><button id="play">pause</button><input id="scrub" type="range" min="0" max="1" step="0.001" value="0" /><span id="clock"></span></div>
<script src="assets/logos.js"></script>
<script src="film.js"></script>
</body>
</html>
