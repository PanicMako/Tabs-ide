name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0 or v1.0.0)"
        required: true
        type: string
      artifact_run_id:
        description: "Successful four-platform Build Desktop Installers run to publish without rebuilding"
        required: false
        type: string

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      previous_version: ${{ steps.validate_release.outputs.previous_version }}
      artifact_run_id: ${{ steps.validate_release.outputs.artifact_run_id }}
      ref: ${{ steps.validate_release.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - id: release_meta
        name: Resolve release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw="$REQUESTED_VERSION"
          else
            raw="${GITHUB_REF_NAME}"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          release_channel=$(node -p "require('./tabs-main/apps/desktop/package.json').tabsReleaseChannel || 'stable'")
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$release_channel" != "beta" ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify manual release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          notes_file=".github/release-notes/${RELEASE_TAG}.md"
          if [[ ! -s "$notes_file" ]]; then
            echo "Missing manual release notes: $notes_file" >&2
            exit 1
          fi
          node scripts/validate-release-notes.mjs "$notes_file"

      - name: Verify release publishing credential
        env:
          TABS_RELEASE_TOKEN: ${{ secrets.TABS_RELEASE_TOKEN }}
        run: |
          if [ -z "$TABS_RELEASE_TOKEN" ]; then
            echo "::error::Configure the repository secret TABS_RELEASE_TOKEN with release write access before starting a release."
            exit 1
          fi

      - name: Verify independent macOS update signing key
        env:
          TABS_MAC_UPDATE_PRIVATE_KEY: ${{ secrets.TABS_MAC_UPDATE_PRIVATE_KEY }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { createPublicKey } from 'node:crypto';
          import { UPDATE_PUBLIC_KEY } from './tabs-main/apps/desktop/src/macPreviewUpdater.ts';
          const key = process.env.TABS_MAC_UPDATE_PRIVATE_KEY?.trim();
          if (!key) throw new Error('TABS_MAC_UPDATE_PRIVATE_KEY is required; Apple signing is separate and optional.');
          const actual = createPublicKey(key).export({ type: 'spki', format: 'pem' }).trim();
          if (actual !== UPDATE_PUBLIC_KEY.trim()) throw new Error('Update signing key does not match the embedded public key. Do not rotate it silently.');
          console.log('Independent macOS update signing key matches the embedded public key.');
          NODE

      - id: validate_release
        name: Verify release version and tag availability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          REQUESTED_ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.RELEASE_VERSION;
          for (const file of [
            'tabs-main/apps/desktop/package.json',
            'tabs-main/apps/server/package.json',
            'tabs-main/apps/web/package.json',
            'tabs-main/packages/contracts/package.json',
          ]) {
            const actual = JSON.parse(fs.readFileSync(file, 'utf8')).version;
            if (actual !== expected) {
              console.error(`::error::${file} has version ${actual}; expected ${expected}.`);
              process.exitCode = 1;
            }
          }
          NODE
          if release_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$release_draft" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published; use a new version."
              exit 1
            fi
          fi
          previous_tag=$(gh release view --json tagName --jq .tagName)
          echo "previous_version=${previous_tag#v}" >> "$GITHUB_OUTPUT"
          artifact_run_id="$REQUESTED_ARTIFACT_RUN_ID"
          if [ -n "$artifact_run_id" ]; then
            if [[ ! "$artifact_run_id" =~ ^[0-9]+$ ]]; then
              echo "::error::artifact_run_id must be a numeric GitHub Actions run ID."
              exit 1
            fi
            run_info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run_id" --jq '[.name, .head_sha, .conclusion] | @tsv')
            IFS=$'\t' read -r run_name run_sha run_conclusion <<< "$run_info"
            if [ "$run_name" = "Build Desktop Installers" ]; then
              if [ "$run_sha" != "$GITHUB_SHA" ]; then
                git fetch origin "$run_sha" --depth=1 || true
                modified_runtime_files=$(git diff --name-only "$run_sha" "$GITHUB_SHA" -- . ':(exclude)*.test.ts' ':(exclude)*.test.tsx' ':(exclude)*.spec.ts' ':(exclude)*.md' ':(exclude).github/*')
                if [ -n "$modified_runtime_files" ]; then
                  echo "::error::Installer artifacts must come from a successful build of this exact commit. Modified runtime files:"
                  echo "$modified_runtime_files"
                  exit 1
                fi
                echo "Installer artifacts were built from $run_sha; verified commit $GITHUB_SHA only touches tests, documentation, or workflows."
              fi
              if [ "$run_conclusion" != "success" ]; then
                echo "::error::Installer artifacts must come from a successful build of this exact commit."
                exit 1
              fi
            elif [ "$run_name" = "Release Desktop" ]; then
              tag_sha=$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')
              if [ -z "$tag_sha" ] || [ "$run_sha" != "$tag_sha" ] || [ "$run_conclusion" != "failure" ]; then
                echo "::error::Release artifacts must come from the existing tag's failed publication run."
                exit 1
              fi
              jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run_id/jobs" --jq '.jobs[] | [.name, .conclusion] | @tsv')
              for name in "Build macOS arm64" "Build macOS x64" "Build Linux x64" "Build Windows x64" "Smoke-test Windows upgrade"; do
                if ! grep -Fxq "$name"$'\t'success <<< "$jobs"; then
                  echo "::error::Source release run lacks a successful $name job."
                  exit 1
                fi
              done
            else
              echo "::error::Unsupported artifact source workflow: $run_name"
              exit 1
            fi
            artifact_names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run_id/artifacts" --jq '.artifacts[] | select(.expired == false) | .name')
            for name in desktop-mac-arm64 desktop-mac-x64 desktop-linux-x64 desktop-win-x64; do
              if ! grep -Fxq "$name" <<< "$artifact_names"; then
                echo "::error::Artifact run $artifact_run_id is missing $name."
                exit 1
              fi
            done
          fi
          echo "artifact_run_id=$artifact_run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libxkbfile-dev

      - name: Install dependencies
        working-directory: tabs-main
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: tabs-main
        run: bun run typecheck

      - name: Lint
        working-directory: tabs-main
        run: bun run lint

      - name: Test
        working-directory: tabs-main
        run: bun run test

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    if: needs.preflight.outputs.artifact_run_id == ''
    runs-on: ${{ matrix.runner }}
    # Fail fast instead of hanging until GitHub's 6h hard limit if the VS Code
    # compile gets stuck (e.g. memory swapping on a small runner).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - label: macOS x64
            runner: macos-14
            platform: mac
            target: dmg
            arch: x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check Windows installer process closer
        if: matrix.platform == 'win'
        shell: pwsh
        run: ./tabs-main/scripts/test-windows-install-processes.ps1

      - name: Install dependencies
        working-directory: tabs-main
        run: bun install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev libsecret-1-dev libxkbfile-dev

      - name: Install VS Code dependencies
        working-directory: tabs-code-main
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"
        run: |
          # Install packages without lifecycle scripts (~3 min).
          # The postinstall spawns 50+ concurrent npm install processes
          # which exhausts 7GB RAM on CI runners and hangs indefinitely.
          npm install --ignore-scripts
          cd build && npm install --ignore-scripts && cd ..

          # Download electron.d.ts types required for workbench compilation.
          # GitHub release assets can intermittently return 5xx responses.
          for attempt in 1 2 3 4 5; do
            if node --experimental-strip-types build/npm/electronTypes.ts; then
              break
            fi

            if [[ "$attempt" == 5 ]]; then
              echo "::error::Unable to download electron.d.ts after $attempt attempts"
              exit 1
            fi

            delay=$((attempt * 15))
            echo "::warning::Electron type download failed; retrying in ${delay}s (attempt ${attempt}/5)"
            sleep "$delay"
          done

          # Remove cpu-features (optional dependency of ssh2) which fails to compile
          # against modern Electron/V8 due to nan pointer tagging deprecation.
          rm -rf node_modules/cpu-features

          # Rebuild native modules against Electron headers (~5-10 min).
          # @electron/rebuild handles header downloading + cross-platform
          # compilation without triggering npm lifecycle scripts (unlike
          # npm rebuild which fails on Windows due to preinstall.ts).
          #
          # IMPORTANT: target the Electron that actually RUNS these modules at
          # runtime — Tabs' Electron (apps/desktop/package.json), NOT
          # tabs-code-main's development Electron. The Code-OSS server is
          # spawned via ELECTRON_RUN_AS_NODE on Tabs' Electron binary, so
          # @parcel/watcher / node-pty / native-keymap must match its ABI or
          # they fail with NODE_MODULE_VERSION mismatch.
          #
          # `--arch` matters: macos-14 is arm64, so the mac-x64 artifact must
          # cross-build x64 natives here, otherwise the x64 DMG ships arm64
          # binaries that won't load on Intel Macs.
          # `--types prod` skips dev and optional dependencies (such as cpu-features).
          electron_version="$(node -p "const p = require('../tabs-main/apps/desktop/package.json'); (p.dependencies && p.dependencies.electron) || (p.devDependencies && p.devDependencies.electron)")"
          echo "Rebuilding Code-OSS native modules for Tabs Electron $electron_version"
          npx --yes @electron/rebuild -v "$electron_version" --arch "${{ matrix.arch }}" --types prod

      - name: Compile VS Code workbench
        working-directory: tabs-code-main
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: |
          # out/ : dev workbench + server-main.js (skip extensions & Monaco
          # typechecking — the desktop build doesn't need them).
          npm run gulp compile-client
          # out-build/nls.messages.{json,js} : required by the desktop artifact
          # assert and the runtime server. Use the without-mangling variant —
          # `compile-build` fails on the protected-fields mangler check.
          npm run gulp compile-build-without-mangling

      # The embedded workbench activates ALL built-in extensions at startup or on
      # file-open, not a curated few. compile-client above skips EVERY extension,
      # and the root install used --ignore-scripts (to dodge the postinstall OOM),
      # so without this step the built-ins ship with neither node_modules nor a
      # compiled out/ — at runtime the extension host throws "Cannot find module
      # .../<ext>/out/..." for each (debug-auto-launch, references-view, npm,
      # ipynb, simple-browser, …) and cascades to dependents (e.g. CodeRabbit
      # needs git; the language features need each other). Install every product
      # extension's deps and compile every product built-in to extensions/<ext>/
      # out (the dev built-in layout the runtime uses). Run unconditionally so the
      # out/ build cache above can't mask a missing extension compile. The
      # compiled-runtime guard in tabs-main/scripts/build-desktop-artifact.ts
      # verifies the result.
      - name: Compile built-in extensions
        working-directory: tabs-code-main
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Shared extensions package (extensions/package.json → vscode-extensions)
          # provides extensions/node_modules/typescript, which
          # typescript-language-features compiles against (referenced literally as
          # ../../../../node_modules/typescript). The parent tabs-code-main install
          # already has typescript 6.0.0-dev at the root, which npm can dedupe
          # against — leaving extensions/node_modules/typescript MISSING and the
          # compile failing with ~48 cascading type errors. Use `npm ci` for the
          # exact locked version, then hard-guarantee the local copy exists.
          (cd extensions && (npm ci --no-audit --no-fund --ignore-scripts || npm install --no-audit --no-fund --ignore-scripts))
          if [ ! -f extensions/node_modules/typescript/lib/typescript.js ]; then
            echo "::warning::typescript not present in extensions/node_modules — forcing a nested local install"
            (cd extensions && npm install typescript@6.0.2 --no-save --no-audit --no-fund --ignore-scripts --install-strategy=nested)
          fi
          test -f extensions/node_modules/typescript/lib/typescript.js
          # Install deps for every PRODUCT built-in extension (plus any nested
          # client/ and server/ packages, e.g. the language features) so each
          # one's TypeScript compiles and its node_modules ship in the runtime.
          # Dep-less extensions (themes, grammars) are a fast no-op. Skip
          # node_modules.
          for pkg in extensions/*/package.json extensions/*/client/package.json extensions/*/server/package.json; do
            [ -f "$pkg" ] || continue
            dir="$(dirname "$pkg")"
            case "$dir" in */node_modules*) continue;; esac
            (cd "$dir" && npm install --no-audit --no-fund --ignore-scripts) || \
              echo "::warning::npm install failed for $dir (continuing; the compile below is the real check)"
          done

          # Compile every PRODUCT built-in extension to extensions/<ext>/out (and
          # client/out, server/out for the language features). We deliberately do
          # NOT use the stock `compile-extensions` gulp task: it ALSO compiles the
          # three .vscode/extensions/* self-host dev tools (vscode-selfhost-*,
          # vscode-extras), which are not shipped (.vscode is stripped from the
          # staged runtime) and whose deps (cockatiel, istanbul-to-vscode) aren't
          # installed here — so it fails the build. Instead derive the product
          # task list from the gulpfile's own `compilations` array (entries whose
          # quoted path starts with `extensions/`, excluding `.vscode/...`), so the
          # names always match real `compile-extension:<name>` tasks and the set
          # can't drift, then run them in one gulp invocation.
          tasks=()
          while IFS= read -r name; do
            tasks+=("compile-extension:$name")
          done < <(grep -oE "'extensions/[^']+/tsconfig.json'" build/gulpfile.extensions.ts \
            | tr -d "'" | sed -E 's#^extensions/##; s#/tsconfig.json$##; s#/#-#g')
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::error::No product extension compile tasks derived from build/gulpfile.extensions.ts"
            exit 1
          fi
          echo "Compiling ${#tasks[@]} product built-in extensions"
          npm run gulp -- "${tasks[@]}"

          # Produce the canonical runtime extension tree. These upstream tasks
          # apply every extension's VSIX ignore rules, bundle esbuild-based
          # extensions, and retain required production/native dependencies.
          # Packaging the development extensions/ tree would add several GB of
          # source, tests and dev dependencies to each downloadable runtime.
          npm run gulp compile-extensions-build
          npm run gulp compile-copilot-extension-build
          # fs-copyfile uses a native binding only on macOS. Linux and Windows
          # use its JavaScript fallback; binding.gyp builds no binary there.
          native_runtime_dir=".build/extensions/git/node_modules/@vscode/fs-copyfile"
          test -f "$native_runtime_dir/lib/native.js" || {
            echo "::error::Packaged @vscode/fs-copyfile JavaScript runtime is missing"
            exit 1
          }
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            electron_version="$(node -p "const p = require('../tabs-main/apps/desktop/package.json'); (p.dependencies && p.dependencies.electron) || (p.devDependencies && p.devDependencies.electron)")"
            npx --yes @electron/rebuild -v "$electron_version" --arch "${{ matrix.arch }}" \
              --module-dir "$native_runtime_dir" --force
            test -f "$native_runtime_dir/build/Release/vscode_fs.node" || {
              echo "::error::Packaged @vscode/fs-copyfile macOS binding is missing"
              find "$native_runtime_dir" -maxdepth 4 -type f -print || true
              exit 1
            }
          fi
          test -f .build/extensions/copilot/package.json

      # Cache electron-builder's downloaded NSIS/7zip/winCodeSign toolchain so a
      # populated run never re-downloads it. The download host (GitHub's
      # electron-builder-binaries releases) intermittently returns 504s that
      # otherwise fail the whole release at the very end. Only the current
      # runner's path exists; the others are ignored.
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-binaries-${{ runner.os }}-${{ matrix.arch }}-v1

      - name: Build desktop artifact
        working-directory: tabs-main
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
              args+=(--signed)
            else
              echo "::warning::macOS signing disabled because one or more Apple signing secrets are missing."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if has_all "$AZURE_TENANT_ID" "$AZURE_CLIENT_ID" "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              args+=(--signed)
            else
              echo "::warning::Windows signing disabled because one or more Azure signing secrets are missing."
            fi
          fi

          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Verify native update artifact and metadata
        if: matrix.platform == 'linux' || matrix.platform == 'win'
        run: node --experimental-strip-types tabs-main/scripts/verify-desktop-update-artifact.ts tabs-main/release "${{ matrix.platform }}" "${{ needs.preflight.outputs.version }}"

      - name: Inspect Linux AppImage update payload
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find tabs-main/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          [[ -n "$appimage" ]]
          extract_root="$RUNNER_TEMP/tabs-appimage"
          mkdir -p "$extract_root"
          (
            cd "$extract_root"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          test -s "$extract_root/squashfs-root/resources/app.asar"
          test -s "$extract_root/squashfs-root/resources/app-update.yml"
          test -s "$extract_root/squashfs-root/resources/tabs-code-main/out/vs/code/electron-browser/workbench/workbench-dev.html"
          test -s "$extract_root/squashfs-root/resources/tabs-code-main/out-build/nls.messages.json"
          test -s "$extract_root/squashfs-root/resources/tabs-code-main/node_modules/minimist/index.js"
          test -s "$extract_root/squashfs-root/resources/tabs-code-main/extensions/node_modules/typescript/lib/typescript.js"
          test -s "$extract_root/squashfs-root/resources/tabs-code-main/extensions/git/node_modules/@vscode/fs-copyfile/lib/native.js"
          test -s "$extract_root/squashfs-root/resources/tabs-code-main/extensions/copilot/node_modules/@anthropic-ai/sdk/package.json"
          grep -Eq '^provider:[[:space:]]*github[[:space:]]*$' "$extract_root/squashfs-root/resources/app-update.yml"

      - name: Inspect Windows NSIS update payload
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem tabs-main/release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated." }
          $extractRoot = Join-Path $env:RUNNER_TEMP "tabs-nsis"
          New-Item $extractRoot -ItemType Directory -Force | Out-Null
          & 7z x $installer.FullName "-o$extractRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the NSIS installer." }
          $appArchive = Get-ChildItem $extractRoot -Recurse -Filter "app-*.7z" | Select-Object -First 1
          if (-not $appArchive) { throw "NSIS installer does not contain an application archive." }
          $appRoot = Join-Path $env:RUNNER_TEMP "tabs-nsis-app"
          New-Item $appRoot -ItemType Directory -Force | Out-Null
          & 7z x $appArchive.FullName "-o$appRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the NSIS application archive." }
          if (-not (Test-Path (Join-Path $appRoot "resources/app.asar") -PathType Leaf)) { throw "Packaged app.asar is missing." }
          $runtimeRoot = Join-Path $appRoot "resources/tabs-code-main"
          if (-not (Test-Path (Join-Path $runtimeRoot "out/vs/code/electron-browser/workbench/workbench-dev.html") -PathType Leaf)) { throw "The full Code OSS runtime is missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "out-build/nls.messages.json") -PathType Leaf)) { throw "Code OSS localization data is missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "node_modules/minimist/index.js") -PathType Leaf)) { throw "Code OSS runtime dependencies are missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "extensions/node_modules/typescript/lib/typescript.js") -PathType Leaf)) { throw "TypeScript extension runtime is missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "extensions/git/node_modules/@vscode/fs-copyfile/lib/native.js") -PathType Leaf)) { throw "Git extension runtime is missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "extensions/copilot/node_modules/@anthropic-ai/sdk/package.json") -PathType Leaf)) { throw "Copilot extension runtime is missing from Windows installer." }
          $updateConfig = Join-Path $appRoot "resources/app-update.yml"
          if (-not (Test-Path $updateConfig -PathType Leaf)) { throw "Packaged app-update.yml is missing." }
          if (-not (Select-String $updateConfig -Pattern '^provider:\s*github\s*$' -Quiet)) { throw "Packaged updater is not configured for GitHub." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned" -and $signature.Status -ne "Valid") { throw "Invalid installer signature: $($signature.Status)" }

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          # Installers for every platform, plus updater payloads. Unsigned macOS
          # preview builds use the ZIP through Tabs' independently signed update
          # manifest; Developer ID builds may continue using the same payload.
          # Each job only produces its own platform's files, so most patterns
          # match nothing on a given runner. `nullglob` drops empty *wildcard*
          # globs, but the literal latest*.yml names need an explicit existence
          # check (mac produces latest-mac.yml, win latest.yml, linux
          # latest-linux.yml).
          shopt -s nullglob
          for pattern in \
            "tabs-main/release/*.dmg" \
            "tabs-main/release/*.zip" \
            "tabs-main/release/*.AppImage" \
            "tabs-main/release/*.AppImage.blockmap" \
            "tabs-main/release/*.exe" \
            "tabs-main/release/*.exe.blockmap" \
            "tabs-main/release/beta*.yml" \
            "tabs-main/release/latest.yml" \
            "tabs-main/release/latest-linux.yml"; do
            for file in $pattern; do
              if [ -e "$file" ]; then
                cp "$file" release-publish/
              fi
            done
          done
          # Ensure the step exits 0 even when the final loop iteration's
          # existence check is false (a bare `[ -e ] && cp` as the script's
          # last command would propagate its non-zero status and fail the job
          # on platforms whose last pattern — latest-linux.yml — is absent).
          echo "Collected $(find release-publish -maxdepth 1 -type f | wc -l) asset(s)."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error
          compression-level: 0

  windows_smoke:
    name: Smoke-test Windows upgrade
    needs: [preflight, build]
    if: needs.preflight.outputs.artifact_run_id == ''
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: desktop-win-x64
          path: tabs-main/release

      - name: Smoke-test Windows install and locked-process upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TABS_SMOKE_PREVIOUS_VERSION: ${{ needs.preflight.outputs.previous_version }}
        run: ./tabs-main/scripts/smoke-windows-installer.ps1

      - name: Upload Windows installer process log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-process-log
          path: |
            ${{ runner.temp }}/tabs-installer-processes.log
            ${{ runner.temp }}/tabs-installer-diagnostics/installer-*.txt
            ${{ runner.temp }}/tabs-installer-diagnostics/installer-*.dmp
            ${{ runner.temp }}/TabsLaunchSmoke/userdata/logs/desktop-main.log
            ${{ runner.temp }}/TabsLaunchSmoke/userdata/logs/server-child.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [preflight, build, windows_smoke]
    if: ${{ always() && needs.preflight.result == 'success' && ((needs.build.result == 'success' && needs.windows_smoke.result == 'success') || (needs.build.result == 'skipped' && needs.windows_smoke.result == 'skipped' && needs.preflight.outputs.artifact_run_id != '')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download artifacts from this release build
        if: needs.preflight.outputs.artifact_run_id == ''
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download validated installer artifacts
        if: needs.preflight.outputs.artifact_run_id != ''
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
          run-id: ${{ needs.preflight.outputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List release assets
        run: ls -lah release-assets/

      - name: Verify release asset set
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          dmgs=(release-assets/*.dmg)
          appimages=(release-assets/*.AppImage)
          installers=(release-assets/*.exe)
          mac_zips=(release-assets/*.zip)
          if (( ${#dmgs[@]} != 2 || ${#mac_zips[@]} != 2 || ${#appimages[@]} != 1 || ${#installers[@]} != 1 )); then
            echo "::error::Expected 2 DMGs, 2 macOS ZIPs, 1 AppImage, and 1 Windows installer; found ${#dmgs[@]}, ${#mac_zips[@]}, ${#appimages[@]}, and ${#installers[@]}."
            exit 1
          fi
          for asset in \
            "Tabs-$RELEASE_VERSION-arm64.dmg" \
            "Tabs-$RELEASE_VERSION-arm64.zip" \
            "Tabs-$RELEASE_VERSION-x64.dmg" \
            "Tabs-$RELEASE_VERSION-x64.zip" \
            "Tabs-$RELEASE_VERSION-x64.exe" \
            "Tabs-$RELEASE_VERSION-x86_64.AppImage"; do
            if [ ! -s "release-assets/$asset" ]; then
              echo "::error::Missing or empty release asset: $asset"
              exit 1
            fi
          done

      - name: Verify downloaded Windows and Linux update assets
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          # GitHub artifact downloads do not preserve Unix executable bits.
          chmod +x release-assets/*.AppImage
          node --experimental-strip-types tabs-main/scripts/verify-desktop-update-artifact.ts release-assets win "$RELEASE_VERSION"
          node --experimental-strip-types tabs-main/scripts/verify-desktop-update-artifact.ts release-assets linux "$RELEASE_VERSION"

      - name: Create signed macOS preview update manifest
        working-directory: tabs-main
        env:
          TABS_MAC_UPDATE_PRIVATE_KEY: ${{ secrets.TABS_MAC_UPDATE_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node --experimental-strip-types scripts/create-mac-preview-update-manifest.ts \
            ../release-assets \
            "$RELEASE_VERSION" \
            "$RELEASE_REPOSITORY" \
            "../.github/release-notes/v$RELEASE_VERSION.md"

      - name: Verify desktop update release notes
        working-directory: tabs-main
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node --experimental-strip-types scripts/verify-desktop-update-metadata.ts \
            ../release-assets \
            "$RELEASE_VERSION" \
            "../.github/release-notes/v$RELEASE_VERSION.md"

      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if release_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$release_draft" != "true" ]; then
              echo "::error::Release $TAG is already published; use a new version instead."
              exit 1
            fi
          fi

      - name: Create draft release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.TABS_RELEASE_TOKEN }}
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: Tabs v${{ needs.preflight.outputs.version }}
          body_path: .github/release-notes/${{ needs.preflight.outputs.tag }}.md
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          draft: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.AppImage.blockmap
            release-assets/*.exe
            release-assets/*.exe.blockmap
            release-assets/latest.yml
            release-assets/latest-linux.yml
            release-assets/beta*.yml
            release-assets/tabs-mac-preview-update.json
            release-assets/tabs-mac-preview-update.json.sig

      - name: Verify release assets and publish atomically
        env:
          GH_TOKEN: ${{ secrets.TABS_RELEASE_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          MAKE_LATEST: ${{ needs.preflight.outputs.make_latest }}
        run: |
          set -euo pipefail
          echo "Verifying assets attached to draft release $TAG..."
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::Release $TAG must remain a draft until verification finishes."
            exit 1
          fi
          release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            --jq '.assets[] | [.name, (.size | tostring), .digest] | @tsv' > attached-assets.tsv

          shopt -s nullglob
          expected_files=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.AppImage.blockmap
            release-assets/*.exe
            release-assets/*.exe.blockmap
            release-assets/latest.yml
            release-assets/latest-linux.yml
            release-assets/beta*.yml
            release-assets/tabs-mac-preview-update.json
            release-assets/tabs-mac-preview-update.json.sig
          )
          if [ "${#expected_files[@]}" -ne "$(wc -l < attached-assets.tsv)" ]; then
            echo "::error::The draft release asset count differs from the verified local asset set."
            exit 1
          fi
          for file in "${expected_files[@]}"; do
            name="${file##*/}"
            attached=$(awk -F '\t' -v name="$name" '$1 == name { print $0 }' attached-assets.tsv)
            if [ -z "$attached" ]; then
              echo "::error::Release $TAG is missing $name."
              exit 1
            fi
            expected_size=$(stat -c%s "$file")
            expected_digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            IFS=$'\t' read -r _ attached_size attached_digest <<< "$attached"
            if [ "$attached_size" != "$expected_size" ] || [ "$attached_digest" != "$expected_digest" ]; then
              echo "::error::Release $TAG has incorrect bytes for $name."
              exit 1
            fi
          done

          echo "Publishing release $TAG atomically (draft: false)..."
          if [ "$MAKE_LATEST" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi
          echo "Release $TAG published successfully."
