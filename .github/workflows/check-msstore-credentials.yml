name: Check Microsoft Store credentials

# Run from the Actions tab after setting or rotating the MSSTORE_* secrets.
# It checks each secret's shape and signs in to the Microsoft Store API with
# them. No secret value is printed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check MSSTORE_* secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check secret format and Store API sign-in
        shell: bash
        env:
          TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          set -uo pipefail
          failed=0
          report() { echo "$1"; echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }
          guid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

          for pair in "MSSTORE_TENANT_ID:$TENANT_ID" "MSSTORE_CLIENT_ID:$CLIENT_ID"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [[ "$value" =~ $guid ]]; then
              report "✅ $name is a single ID."
            else
              report "❌ $name is not a single ID (it is ${#value} characters; an ID is 36). Set it again."
              failed=1
            fi
          done

          if [[ "$SELLER_ID" =~ ^[0-9]+$ ]]; then
            report "✅ MSSTORE_SELLER_ID is a number."
          elif [[ -z "$SELLER_ID" ]]; then
            report "❌ MSSTORE_SELLER_ID is empty."; failed=1
          else
            report "❌ MSSTORE_SELLER_ID should be digits only (it is ${#SELLER_ID} characters). Copy just the Seller ID and set it again."; failed=1
          fi

          if [[ -z "$CLIENT_SECRET" ]]; then
            report "❌ MSSTORE_CLIENT_SECRET is empty."; failed=1
          elif [[ "$CLIENT_SECRET" =~ [[:space:]] ]]; then
            report "❌ MSSTORE_CLIENT_SECRET contains spaces or line breaks, so extra text was pasted with the key. Set it again with only the key."; failed=1
          else
            report "✅ MSSTORE_CLIENT_SECRET has no spaces or line breaks (${#CLIENT_SECRET} characters)."
          fi

          if [[ "$TENANT_ID" =~ $guid && "$CLIENT_ID" =~ $guid && -n "$CLIENT_SECRET" ]]; then
            status=$(curl -sS -o token.json -w '%{http_code}' -X POST \
              "https://login.microsoftonline.com/$TENANT_ID/oauth2/v2.0/token" \
              --data-urlencode grant_type=client_credentials \
              --data-urlencode "client_id=$CLIENT_ID" \
              --data-urlencode "client_secret=$CLIENT_SECRET" \
              --data-urlencode "scope=https://api.store.microsoft.com/.default")
            if [[ "$status" == "200" ]] && jq -e '.access_token' token.json >/dev/null; then
              report "✅ Signed in to the Microsoft Store API with the tenant, client and key."
            else
              reason=$(jq -r '(.error // "unknown") + ": " + ((.error_description // "") | split("\r\n")[0])' token.json 2>/dev/null || echo "HTTP $status")
              report "❌ Microsoft rejected the sign-in ($reason)."
              failed=1
            fi
            rm -f token.json
          fi

          exit "$failed"
