name: Build Desktop Installers
run-name: Desktop installers · ${{ inputs.version || github.ref_name }}

# One run builds every full installer: macOS arm64 and x64 (DMG + ZIP), Linux
# x64 (AppImage + .deb), the Windows x64 NSIS installer and the Microsoft Store
# AppX. Stages: plan → preflight + compile once → package per platform in
# parallel → Windows install/upgrade verification → summary.
# Smoke-only checks of an existing run live in smoke-desktop.yml.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Installers to build (comma-separated: mac-arm64, mac-x64, linux-x64, win-x64, win-x64-appx). Empty builds all of them."
        required: false
        default: "mac-arm64,mac-x64,linux-x64,win-x64,win-x64-appx"
        type: string
      version:
        description: "Build version label (leave empty to use package.json version)"
        required: false
        type: string
      previous_version:
        description: "Released version used for the Windows upgrade check"
        required: false
        default: "2.2.0"
        type: string

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      windows: ${{ steps.windows.outputs.selected }}
    steps:
      - id: matrix
        name: Pick installers
        uses: actions/github-script@v7
        env:
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        with:
          script: |
            // `artifact` names are read by Release Desktop (artifact_run_id):
            // it publishes every desktop-* artifact. The Store package is
            // signed by Partner Center and never a GitHub release asset, so its
            // artifact is deliberately not desktop-*.
            const allTargets = {
              'mac-arm64':    { key: 'mac-arm64',    label: 'macOS arm64 · DMG + ZIP',            runner: 'macos-15',     platform: 'mac',   target: 'dmg',          arch: 'arm64', artifact: 'desktop-mac-arm64' },
              'mac-x64':      { key: 'mac-x64',      label: 'macOS x64 · DMG + ZIP',              runner: 'macos-15',     platform: 'mac',   target: 'dmg',          arch: 'x64',   artifact: 'desktop-mac-x64' },
              'linux-x64':    { key: 'linux-x64',    label: 'Linux x64 · AppImage + .deb',        runner: 'ubuntu-24.04', platform: 'linux', target: 'AppImage,deb', arch: 'x64',   artifact: 'desktop-linux-x64' },
              'win-x64':      { key: 'win-x64',      label: 'Windows x64 · NSIS installer',       runner: 'windows-2022', platform: 'win',   target: 'nsis',         arch: 'x64',   artifact: 'desktop-win-x64' },
              // Needs the Partner Center identity (repository variables TABS_APPX_*).
              'win-x64-appx': { key: 'win-x64-appx', label: 'Windows x64 · Microsoft Store AppX', runner: 'windows-2022', platform: 'win',   target: 'appx',         arch: 'x64',   artifact: 'store-win-x64-appx' },
            };

            const input = (process.env.REQUESTED_PLATFORMS || '').trim();
            const keys = input ? input.split(',').map(k => k.trim()).filter(Boolean) : Object.keys(allTargets);
            const include = [];
            for (const key of keys) {
              const entry = allTargets[key];
              if (!entry) {
                core.setFailed(`Unknown platform key: ${key}. Valid keys: ${Object.keys(allTargets).join(', ')}`);
                return;
              }
              if (include.includes(entry)) {
                core.setFailed(`Platform ${key} is listed twice.`);
                return;
              }
              include.push(entry);
            }
            if (include.length === 0) {
              core.setFailed('No platforms selected.');
              return;
            }
            return { include };

      - id: windows
        name: Note whether the NSIS installer is built
        shell: bash
        env:
          MATRIX: ${{ steps.matrix.outputs.result }}
        run: |
          if jq -e '.include[] | select(.key == "win-x64")' <<< "$MATRIX" >/dev/null; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
          fi

  linux_preflight:
    name: Preflight · Linux bootstrap tests
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Linux system dependencies
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' \
                      -e 's|azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|g' \
                      /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          printf "nameserver 8.8.8.8\nnameserver 1.1.1.1\n" | sudo tee /etc/resolv.conf >/dev/null || true
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 && \
               sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 libkrb5-dev libsecret-1-dev libxkbfile-dev; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to install Linux system dependencies after 3 attempts"
              exit 1
            fi
            echo "::warning::apt-get failed; retrying in 10s (attempt $attempt/3)"
            sleep 10
          done

      - name: Install dependencies
        working-directory: tabs-app
        run: bun install --frozen-lockfile

      - name: Test bootstrap pipe on Linux
        working-directory: tabs-app/apps/server
        run: bun scripts/test.ts src/bootstrap.test.ts

      - name: Test restored workspace RPC routes on Linux
        working-directory: tabs-app
        run: bun run test:workspace-rpc

  # The workbench (out/, out-build/) is plain JavaScript, identical on every
  # platform, so it is compiled once here on Linux and handed to each platform
  # job. macOS runners took 10-28 min for this compile (3 cores, 7 GB RAM); this
  # Linux runner takes about 4. The result is cached by the git tree hash of
  # tabs-code-oss, so a build whose Code-OSS sources are unchanged skips the
  # install and compile. Bump the `-v1` salt when the compile commands change.
  # Built-in extensions stay per platform: .build/extensions carries
  # platform-specific packages (such as @github/copilot-<os>-<arch>).
  compile_workbench:
    name: Compile · Code-OSS workbench (once, all platforms)
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Key the workbench on the Code-OSS sources
        id: key
        shell: bash
        run: |
          set -euo pipefail
          echo "key=code-oss-workbench-v1-$(git rev-parse HEAD:tabs-code-oss)" >> "$GITHUB_OUTPUT"

      - name: Restore compiled workbench
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: code-oss-workbench.tar
          key: ${{ steps.key.outputs.key }}

      - name: Setup Node
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        if: steps.cache.outputs.cache-hit != 'true'
        # Code-OSS 1.146+ is a pnpm workspace; the version comes from the
        # packageManager field of tabs-code-oss/package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: tabs-code-oss/package.json

      - name: Install VS Code dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: tabs-code-oss
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          # The workbench gulp tasks import dependencies from build/package.json.
          # Those are not installed by the root package install.
          pnpm --dir build install --frozen-lockfile --ignore-scripts
          # Download electron.d.ts types required for workbench compilation.
          # GitHub release assets can intermittently return 5xx responses.
          for attempt in 1 2 3 4 5; do
            if node --experimental-strip-types build/npm/electronTypes.ts; then
              break
            fi

            if [[ "$attempt" == 5 ]]; then
              echo "::error::Unable to download electron.d.ts after $attempt attempts"
              exit 1
            fi

            delay=$((attempt * 15))
            echo "::warning::Electron type download failed; retrying in ${delay}s (attempt ${attempt}/5)"
            sleep "$delay"
          done

      - name: Compile VS Code workbench
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: tabs-code-oss
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: |
          # out/ : dev workbench + server-main.js (skip extensions & Monaco
          # typechecking — the desktop build doesn't need them).
          pnpm run gulp compile-client
          # out-build/nls.messages.{json,js} : required by the artifact assert and
          # the runtime. without-mangling avoids the protected-fields mangler error.
          pnpm run gulp compile-build-without-mangling
          # Code-OSS 1.140 writes nls.messages.json to out-build via bundle --nls
          test -s out-build/nls.messages.json || node build/next/index.ts bundle --nls

      - name: Pack compiled workbench
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f tabs-code-oss/out/vs/code/electron-browser/workbench/workbench-dev.html
          test -s tabs-code-oss/out-build/nls.messages.json
          tar -cf code-oss-workbench.tar -C tabs-code-oss out out-build

      - name: Save compiled workbench
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: code-oss-workbench.tar
          key: ${{ steps.key.outputs.key }}

      - name: Upload compiled workbench
        uses: actions/upload-artifact@v7
        with:
          name: code-oss-workbench
          path: code-oss-workbench.tar
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package · ${{ matrix.label }}
    needs: [plan, linux_preflight, compile_workbench]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check Windows installer process closer
        if: matrix.platform == 'win' && matrix.target == 'nsis'
        shell: pwsh
        run: ./tabs-app/scripts/test-windows-install-processes.ps1

      # Bun's download cache; Windows spent 4-6 min in this install.
      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('tabs-app/bun.lock') }}
          restore-keys: bun-install-${{ runner.os }}-

      - name: Install dependencies
        working-directory: tabs-app
        run: bun install --frozen-lockfile

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' \
                      -e 's|azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|g' \
                      /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
          printf "nameserver 8.8.8.8\nnameserver 1.1.1.1\n" | sudo tee /etc/resolv.conf >/dev/null || true
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 && \
               sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 libkrb5-dev libsecret-1-dev libxkbfile-dev; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to install Linux system dependencies after 3 attempts"
              exit 1
            fi
            echo "::warning::apt-get failed; retrying in 10s (attempt $attempt/3)"
            sleep 10
          done

      - name: Setup pnpm
        # Code-OSS 1.146+ is a pnpm workspace; the version comes from the
        # packageManager field of tabs-code-oss/package.json.
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: tabs-code-oss/package.json

      - name: Install VS Code dependencies
        working-directory: tabs-code-oss
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          # The workbench gulp tasks import dependencies from build/package.json.
          # Those are not installed by the root package install.
          pnpm --dir build install --frozen-lockfile --ignore-scripts
          # Download electron.d.ts types required for workbench compilation.
          # GitHub release assets can intermittently return 5xx responses.
          for attempt in 1 2 3 4 5; do
            if node --experimental-strip-types build/npm/electronTypes.ts; then
              break
            fi

            if [[ "$attempt" == 5 ]]; then
              echo "::error::Unable to download electron.d.ts after $attempt attempts"
              exit 1
            fi

            delay=$((attempt * 15))
            echo "::warning::Electron type download failed; retrying in ${delay}s (attempt ${attempt}/5)"
            sleep "$delay"
          done

      # out/ and out-build/ come from the compile_workbench job.
      - name: Download compiled workbench
        uses: actions/download-artifact@v8
        with:
          name: code-oss-workbench
          path: code-oss-workbench

      - name: Unpack compiled workbench
        shell: bash
        run: |
          set -euo pipefail
          tar -xf code-oss-workbench/code-oss-workbench.tar -C tabs-code-oss
          rm -rf code-oss-workbench
          test -f tabs-code-oss/out/vs/code/electron-browser/workbench/workbench-dev.html
          test -s tabs-code-oss/out-build/nls.messages.json

      # The embedded workbench activates ALL built-in extensions at startup or on
      # file-open, not a curated few. compile-client above skips EVERY extension,
      # and the root install used --ignore-scripts (to dodge the postinstall OOM),
      # so without this step the built-ins ship with neither node_modules nor a
      # compiled out/ — at runtime the extension host throws "Cannot find module
      # .../<ext>/out/..." for each (debug-auto-launch, references-view, npm,
      # ipynb, simple-browser, …) and cascades to dependents (e.g. CodeRabbit
      # needs git; the language features need each other). Install every product
      # extension's deps and compile every product built-in to extensions/<ext>/
      # out (the dev built-in layout the runtime uses). Run unconditionally so the
      # out/ build cache above can't mask a missing extension compile. The
      # compiled-runtime guard in tabs-app/scripts/build-desktop-artifact.ts
      # verifies the result.
      - name: Compile built-in extensions
        working-directory: tabs-code-oss
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Since 1.148 the root install above covers every built-in extension and
          # Copilot (one pnpm workspace, isolated linker); typescript-language-features
          # compiles against the extensions workspace's typescript link.
          test -f extensions/node_modules/typescript/lib/typescript.js

          # Compile every PRODUCT built-in extension to extensions/<ext>/out (and
          # client/out, server/out for the language features). We deliberately do
          # NOT use the stock `compile-extensions` gulp task: it ALSO compiles the
          # three .vscode/extensions/* self-host dev tools (vscode-selfhost-*,
          # vscode-extras), which are not shipped (.vscode is stripped from the
          # staged runtime) and whose deps (cockatiel, istanbul-to-vscode) aren't
          # installed here — so it fails the build. Instead derive the product
          # task list from the gulpfile's own `compilations` array (entries whose
          # quoted path starts with `extensions/`, excluding `.vscode/...`), so the
          # names always match real `compile-extension:<name>` tasks and the set
          # can't drift, then run them in one gulp invocation.
          tasks=()
          while IFS= read -r name; do
            tasks+=("compile-extension:$name")
          done < <(grep -oE "'extensions/[^']+/tsconfig.json'" build/gulpfile.extensions.ts \
            | tr -d "'" | sed -E 's#^extensions/##; s#/tsconfig.json$##; s#/#-#g')
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::error::No product extension compile tasks derived from build/gulpfile.extensions.ts"
            exit 1
          fi
          echo "Compiling ${#tasks[@]} product built-in extensions"
          pnpm run gulp "${tasks[@]}"

          # Produce the same lean extension layout used by upstream Code-OSS
          # distributions instead of shipping source and dev dependencies.
          pnpm run gulp compile-extensions-build
          pnpm run gulp compile-copilot-extension-build
          # Packaging cleans .build/extensions; generate media into the final tree afterwards.
          pnpm run gulp compile-extension-media-build
          bun ../tabs-app/scripts/verify-code-oss-media.ts .build/extensions
          # fs-copyfile uses a native binding only on macOS. Linux and Windows
          # use its JavaScript fallback; binding.gyp builds no binary there.
          native_runtime_dir=".build/extensions/git/node_modules/@vscode/fs-copyfile"
          test -f "$native_runtime_dir/lib/native.js" || {
            echo "::error::Packaged @vscode/fs-copyfile JavaScript runtime is missing"
            exit 1
          }
          test -f .build/extensions/copilot/package.json

      - name: Resolve Code-OSS runtime module key
        id: runtime_modules_key
        shell: bash
        run: |
          set -euo pipefail
          electron_version="$(node -p "const p = require('./tabs-app/apps/desktop/package.json'); (p.dependencies && p.dependencies.electron) || (p.devDependencies && p.devDependencies.electron)")"
          echo "electron=$electron_version" >> "$GITHUB_OUTPUT"
          # The isolated install above only served the extension compile.
          rm -rf tabs-code-oss/node_modules

      # The hoisted root node_modules with natives rebuilt for Tabs' Electron
      # depends only on the lockfile, the OS/arch and the Electron version, so
      # reuse it instead of reinstalling and recompiling natives on every run.
      - name: Restore Code-OSS runtime modules
        id: runtime_modules
        uses: actions/cache/restore@v4
        with:
          path: tabs-code-oss/node_modules
          key: code-oss-runtime-modules-v1-${{ runner.os }}-${{ matrix.arch }}-electron-${{ steps.runtime_modules_key.outputs.electron }}-${{ hashFiles('tabs-code-oss/pnpm-lock.yaml', 'tabs-code-oss/package.json', 'tabs-code-oss/pnpm-workspace.yaml', 'tabs-code-oss/.pnpmfile.mjs', 'tabs-code-oss/build/npm/patchNativeGyp.ts', 'tabs-code-oss/build/npm/patches/**') }}

      # Code-OSS 1.148 is one pnpm workspace (root, extensions, Copilot) that
      # compiles from pnpm's isolated layout: build/lib/dependencies.ts refuses a
      # hoisted install of it. The Tabs runtime ships the root node_modules as-is,
      # so reinstall only the root project with the hoisted linker: the same flat,
      # symlink-free layout 1.146 shipped, without every extension's dependencies
      # (.build/extensions already carries those). Native modules are prepared
      # here, after the relayout, so they are not discarded with the old layout.
      - name: Lay out Code-OSS runtime dependencies
        if: steps.runtime_modules.outputs.cache-hit != 'true'
        working-directory: tabs-code-oss
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          # pnpm will not switch the linker of an existing modules directory
          # in a filtered install, so start the root layout from scratch.
          rm -rf node_modules
          pnpm install --frozen-lockfile --ignore-scripts --filter . --config.node-linker=hoisted
          test -f node_modules/minimist/index.js && test ! -L node_modules/minimist || {
            echo "::error::Code-OSS root node_modules is not a hoisted layout"
            exit 1
          }
          # Remove cpu-features (optional dependency of ssh2) which fails to compile
          # against modern Electron/V8 due to nan pointer tagging deprecation.
          rm -rf node_modules/cpu-features
          # Ensure macOS native modules (such as @vscode/policy-watcher using std::variant)
          # target macOS 11.0+ instead of node-addon-api's default 10.7 which causes
          # Xcode 15/16 libc++ availability errors.
          node --experimental-strip-types build/npm/patchNativeGyp.ts
          # Target the Electron that RUNS these modules at runtime (from Tabs'
          # desktop package) — not tabs-code-oss's development Electron. The
          # Code-OSS server runs via ELECTRON_RUN_AS_NODE
          # on Tabs' Electron, so native modules must match its ABI.
          # `--arch` cross-builds x64 natives for the mac-x64 artifact on the
          # arm64 macos-15 runner.
          # `--types prod` skips dev and optional dependencies (such as cpu-features).
          electron_version="$(node -p "const p = require('../tabs-app/apps/desktop/package.json'); (p.dependencies && p.dependencies.electron) || (p.devDependencies && p.devDependencies.electron)")"
          echo "Rebuilding Code-OSS native modules for Tabs Electron $electron_version"
          npx --yes @electron/rebuild -v "$electron_version" --arch "${{ matrix.arch }}" --types prod

      - name: Save Code-OSS runtime modules
        if: steps.runtime_modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tabs-code-oss/node_modules
          key: ${{ steps.runtime_modules.outputs.cache-primary-key }}

      - name: Build the packaged git extension's macOS fs-copyfile binding
        if: matrix.platform == 'mac'
        working-directory: tabs-code-oss
        shell: bash
        run: |
          set -euo pipefail
          # The packaged git extension's fs-copyfile needs node-addon-api to build
          # its macOS binding. Since 1.148 only this hoisted root layout provides it
          # where node-gyp looks (up the tree from .build/extensions).
          native_runtime_dir=".build/extensions/git/node_modules/@vscode/fs-copyfile"
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            electron_version="$(node -p "const p = require('../tabs-app/apps/desktop/package.json'); (p.dependencies && p.dependencies.electron) || (p.devDependencies && p.devDependencies.electron)")"
            npx --yes @electron/rebuild -v "$electron_version" --arch "${{ matrix.arch }}" \
              --module-dir "$native_runtime_dir" --force
            test -f "$native_runtime_dir/build/Release/vscode_fs.node" || {
              echo "::error::Packaged @vscode/fs-copyfile macOS binding is missing"
              find "$native_runtime_dir" -maxdepth 4 -type f -print || true
              exit 1
            }
          fi

      # electron-builder's NSIS/7zip/AppImage toolchain downloads.
      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-binaries-${{ runner.os }}-${{ matrix.arch }}-v1

      - name: Build desktop artifact
        working-directory: tabs-app
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          # Partner Center → Product identity. Only read by the appx target.
          TABS_APPX_IDENTITY_NAME: ${{ vars.TABS_APPX_IDENTITY_NAME }}
          TABS_APPX_PUBLISHER: ${{ vars.TABS_APPX_PUBLISHER }}
          TABS_APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.TABS_APPX_PUBLISHER_DISPLAY_NAME }}
          TABS_APPX_DISPLAY_NAME: ${{ vars.TABS_APPX_DISPLAY_NAME || 'Tabs IDE' }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --verbose
          )

          version="$REQUESTED_VERSION"
          if [[ -n "$version" ]]; then
            version="${version#v}"
            args+=(--build-version "$version")
          fi

          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Verify native update artifact and metadata
        if: matrix.platform == 'linux' || (matrix.platform == 'win' && matrix.target == 'nsis')
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version="$(node -p "require('./tabs-app/apps/desktop/package.json').version")"
          fi
          node --experimental-strip-types tabs-app/scripts/verify-desktop-update-artifact.ts tabs-app/release "${{ matrix.platform }}" "${version#v}"

      - name: Inspect Linux AppImage update payload
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find tabs-app/release -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          [[ -n "$appimage" ]]
          extract_root="$RUNNER_TEMP/tabs-appimage"
          mkdir -p "$extract_root"
          (
            cd "$extract_root"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          test -s "$extract_root/squashfs-root/resources/app.asar"
          test -s "$extract_root/squashfs-root/resources/app-update.yml"
          test -s "$extract_root/squashfs-root/resources/tabs-code-oss/out/vs/code/electron-browser/workbench/workbench-dev.html"
          test -s "$extract_root/squashfs-root/resources/tabs-code-oss/out-build/nls.messages.json"
          test -s "$extract_root/squashfs-root/resources/tabs-code-oss/node_modules/minimist/index.js"
          test -s "$extract_root/squashfs-root/resources/tabs-code-oss/extensions/node_modules/typescript/lib/typescript.js"
          test -s "$extract_root/squashfs-root/resources/tabs-code-oss/extensions/git/node_modules/@vscode/fs-copyfile/lib/native.js"
          test -s "$extract_root/squashfs-root/resources/tabs-code-oss/extensions/copilot/node_modules/@github/copilot/package.json"
          bun tabs-app/scripts/verify-code-oss-media.ts "$extract_root/squashfs-root/resources/tabs-code-oss/extensions"
          grep -Eq '^provider:[[:space:]]*github[[:space:]]*$' "$extract_root/squashfs-root/resources/app-update.yml"

      - name: Inspect Windows NSIS update payload
        if: matrix.platform == 'win' && matrix.target == 'nsis'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem tabs-app/release -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated." }
          $extractRoot = Join-Path $env:RUNNER_TEMP "tabs-nsis"
          New-Item $extractRoot -ItemType Directory -Force | Out-Null
          & 7z x $installer.FullName "-o$extractRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the NSIS installer." }
          $appArchive = Get-ChildItem $extractRoot -Recurse -Filter "app-*.7z" | Select-Object -First 1
          if (-not $appArchive) { throw "NSIS installer does not contain an application archive." }
          $appRoot = Join-Path $env:RUNNER_TEMP "tabs-nsis-app"
          New-Item $appRoot -ItemType Directory -Force | Out-Null
          & 7z x $appArchive.FullName "-o$appRoot" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the NSIS application archive." }
          if (-not (Test-Path (Join-Path $appRoot "resources/app.asar") -PathType Leaf)) { throw "Packaged app.asar is missing." }
          $runtimeRoot = Join-Path $appRoot "resources/tabs-code-oss"
          & node --experimental-strip-types tabs-app/scripts/verify-windows-runtime-payload.ts $runtimeRoot (Join-Path $appRoot "Tabs.exe")
          if ($LASTEXITCODE -ne 0) { throw "Windows editor payload failed production packaging checks." }
          & bun tabs-app/scripts/verify-code-oss-media.ts (Join-Path $runtimeRoot "extensions")
          if ($LASTEXITCODE -ne 0) { throw "Windows editor extension media is incomplete." }
          if (-not (Test-Path (Join-Path $runtimeRoot "out/vs/code/electron-browser/workbench/workbench-dev.html") -PathType Leaf)) { throw "The full Code OSS runtime is missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "out-build/nls.messages.json") -PathType Leaf)) { throw "Code OSS localization data is missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "node_modules/minimist/index.js") -PathType Leaf)) { throw "Code OSS runtime dependencies are missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "extensions/node_modules/typescript/lib/typescript.js") -PathType Leaf)) { throw "TypeScript extension runtime is missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "extensions/git/node_modules/@vscode/fs-copyfile/lib/native.js") -PathType Leaf)) { throw "Git extension runtime is missing from Windows installer." }
          if (-not (Test-Path (Join-Path $runtimeRoot "extensions/copilot/node_modules/@github/copilot/package.json") -PathType Leaf)) { throw "Copilot extension runtime is missing from Windows installer." }
          $updateConfig = Join-Path $appRoot "resources/app-update.yml"
          if (-not (Test-Path $updateConfig -PathType Leaf)) { throw "Packaged app-update.yml is missing." }
          if (-not (Select-String $updateConfig -Pattern '^provider:\s*github\s*$' -Quiet)) { throw "Packaged updater is not configured for GitHub." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned" -and $signature.Status -ne "Valid") { throw "Invalid installer signature: $($signature.Status)" }

      - name: Verify Debian package
        if: matrix.platform == 'linux'
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [[ -z "$version" ]]; then
            version="$(node -p "require('./tabs-app/apps/desktop/package.json').version")"
          fi
          version="${version#v}"
          node --experimental-strip-types tabs-app/scripts/verify-deb-package.ts "tabs-app/release/Tabs-$version-amd64.deb" "$version" x64

      - name: Inspect Store AppX package
        if: matrix.platform == 'win' && matrix.target == 'appx'
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TABS_APPX_IDENTITY_NAME: ${{ vars.TABS_APPX_IDENTITY_NAME }}
          TABS_APPX_PUBLISHER: ${{ vars.TABS_APPX_PUBLISHER }}
          TABS_APPX_PUBLISHER_DISPLAY_NAME: ${{ vars.TABS_APPX_PUBLISHER_DISPLAY_NAME }}
          TABS_APPX_DISPLAY_NAME: ${{ vars.TABS_APPX_DISPLAY_NAME || 'Tabs IDE' }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:REQUESTED_VERSION
          if (-not $version) { $version = node -p "require('./tabs-app/apps/desktop/package.json').version" }
          $version = $version.TrimStart("v")
          $appx = Join-Path tabs-app/release "Tabs-$version-x64.appx"
          if (-not (Test-Path $appx -PathType Leaf)) { throw "Store package was not generated: $appx" }
          # An .appx is a zip container; Expand-Archive only accepts the .zip extension.
          $zip = Join-Path $env:RUNNER_TEMP "tabs-appx.zip"
          Copy-Item $appx $zip -Force
          $root = Join-Path $env:RUNNER_TEMP "tabs-appx"
          Expand-Archive $zip -DestinationPath $root -Force
          $manifestXml = Join-Path $root "AppxManifest.xml"
          Write-Host "Verifying AppX manifest at $manifestXml..."
          & node --experimental-strip-types tabs-app/scripts/verify-appx-package.ts $manifestXml $version x64
          if ($LASTEXITCODE -ne 0) { throw "AppX manifest validation failed." }
          $app = Join-Path $root "app"
          foreach ($required in @("Tabs.exe", "resources/app.asar", "resources/tabs-code-oss/out-build/nls.messages.json", "resources/tabs-code-oss/node_modules/minimist/index.js")) {
            if (-not (Test-Path (Join-Path $app $required) -PathType Leaf)) { throw "Store package is missing app/$required." }
          }
          # Store builds are updated by the Store: no NSIS updater config may be shipped as a feed.
          if (Test-Path (Join-Path $root "app/resources/app-update.yml")) { Write-Host "::notice::app-update.yml is present; the app disables its updater when process.windowsStore is true." }
          & node --experimental-strip-types tabs-app/scripts/verify-windows-runtime-payload.ts (Join-Path $app "resources/tabs-code-oss") (Join-Path $app "Tabs.exe")
          if ($LASTEXITCODE -ne 0) { throw "Windows editor payload failed production packaging checks." }

          # Generate Store upload bundle (.appxupload)
          $appxUpload = Join-Path tabs-app/release "Tabs-$version-x64.appxupload"
          Write-Host "Creating Store upload bundle: $appxUpload"
          $bundleZip = Join-Path $env:RUNNER_TEMP "tabs-bundle.zip"
          if (Test-Path $bundleZip) { Remove-Item $bundleZip -Force }
          Compress-Archive -Path $appx -DestinationPath $bundleZip -Force
          Move-Item -Path $bundleZip -Destination $appxUpload -Force
          if (-not (Test-Path $appxUpload -PathType Leaf)) { throw "Store upload bundle was not generated: $appxUpload" }
          $bundleSize = (Get-Item $appxUpload).Length
          Write-Host "Store upload bundle generated successfully: $bundleSize bytes."

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts

          shopt -s nullglob
          for pattern in \
            "tabs-app/release/*.dmg" \
            "tabs-app/release/*.zip" \
            "tabs-app/release/*.AppImage" \
            "tabs-app/release/*.deb" \
            "tabs-app/release/*.appx" \
            "tabs-app/release/*.appxupload" \
            "tabs-app/release/*.exe" \
            "tabs-app/release/*.blockmap" \
            "tabs-app/release/latest*.yml" \
            "tabs-app/release/beta*.yml" \
            "tabs-app/release/builder-debug.yml"; do
            for file in $pattern; do
              cp "$file" artifacts/
            done
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          # Installers are already compressed; zipping them again only costs time.
          compression-level: 0

      - name: Describe installers for the summary
        if: always()
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          KEY: ${{ matrix.key }}
          ARTIFACT: ${{ matrix.artifact }}
        run: node .github/scripts/installer-manifest.cjs "installer-manifest/$KEY.json" artifacts

      - name: Upload installer manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ matrix.key }}
          path: installer-manifest/
          if-no-files-found: ignore
          retention-days: 14

  # Installs the freshly built NSIS installer over the previous release while
  # Tabs is running, on a clean Windows runner.
  verify_windows:
    name: Verify · Windows install + locked-process upgrade
    needs: [plan, package]
    if: ${{ !cancelled() && needs.plan.outputs.windows == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: desktop-win-x64
          path: tabs-app/release

      - name: Smoke-test Windows install and locked-process upgrade
        shell: pwsh
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TABS_SMOKE_PREVIOUS_VERSION: ${{ inputs.previous_version || '1.3.15' }}
        run: ./tabs-app/scripts/smoke-windows-installer.ps1

      - name: Upload Windows installation timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-timings
          path: ${{ runner.temp }}/tabs-installer-metrics.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Windows installer process log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-process-log
          path: |
            ${{ runner.temp }}/tabs-installer-processes.log
            ${{ runner.temp }}/tabs-installer-diagnostics/installer-*.txt
            ${{ runner.temp }}/tabs-installer-diagnostics/installer-*.dmp
            ${{ runner.temp }}/TabsLaunchSmoke/userdata/logs/desktop-main.log
            ${{ runner.temp }}/TabsLaunchSmoke/userdata/logs/server-child.log
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: Summary
    needs: [plan, linux_preflight, compile_workbench, package, verify_windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout summary scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: .github/scripts

      - name: Download installer manifests
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: manifest-*
          merge-multiple: true
          path: installer-manifest

      - name: Write run summary
        uses: actions/github-script@v7
        with:
          script: |
            const summarize = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/desktop-build-summary.cjs`);
            await summarize({ github, context, core, manifestDir: 'installer-manifest', title: 'Desktop installers' });
