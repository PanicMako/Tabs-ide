<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Calculator</h1>
      <p>Two commands run in Tabs' disposable logic runtime. No workspace or network access is requested.</p>
      <form id="calculator">
        <label for="first">First number</label>
        <input id="first" name="first" type="number" step="any" required />
        <label for="second">Second number</label>
        <input id="second" name="second" type="number" step="any" required />
        <label for="operation">Operation</label>
        <select id="operation" name="operation">
          <option value="add">Add</option>
          <option value="multiply">Multiply</option>
        </select>
        <button type="submit">Calculate</button>
      </form>
      <p id="result" role="status" aria-live="polite"></p>
      <p id="error" role="alert"></p>
      <details>
        <summary>Keyboard help</summary>
        <p>Use Tab to move through fields and the button. Press Enter to calculate.</p>
      </details>
    </main>
  </body>
</html>
